# Phase 7 PR7: scrape the Linkerd identity controller.
#
# The ONLY reason this exists is to get `issuer_cert_ttl_seconds` into Mimir so
# the mesh's issuer certificate cannot expire silently. The issuer expires
# 2027-07-28 and, when it does, every proxy stops being able to get a workload
# certificate and all meshed traffic fails. See
# cluster/talos/use1/linkerd-cert-rotation.md.
#
# Deliberately a PodMonitor rather than an edit to the alloy-metrics
# `config.alloy`. The Alloy config already runs
# `prometheus.operator.podmonitors "primary"` with selector instance=primary, so
# this is picked up with NO change to the collector config at all. That matters:
# in PR3 an Alloy ConfigMap that passed both `kustomize build` and
# `yaml.safe_load` contained an invalid component reference, CrashLooped
# alloy-receiver and silently killed cluster-wide OTLP ingestion. alloy-metrics
# is the scrape path that keeps every other alert working, so it is not worth
# touching when a plain CRD does the job.
#
# Scoped to the identity component and its admin port only. The other control
# plane components use different admin port NAMES (dest-admin, policy-admin,
# spval-admin, injector-admin), so they are simply not selected, which keeps the
# added cardinality to one small target.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-identity
  namespace: alloy-metrics
  labels:
    # Required: this is what alloy-metrics' podmonitors component selects on.
    instance: primary
spec:
  namespaceSelector:
    matchNames:
      - linkerd
  selector:
    matchLabels:
      linkerd.io/control-plane-component: identity
  podMetricsEndpoints:
    - port: ident-admin
      path: /metrics
      interval: 60s
