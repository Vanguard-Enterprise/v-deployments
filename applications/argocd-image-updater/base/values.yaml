config:
  argocd:
    grpcWeb: true
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: false
    plaintext: false
  logLevel: info
  registries:
    - name: GitHub Container Registry
      api_url: https://ghcr.io
      prefix: ghcr.io
      ping: yes
      credentials: pullsecret:argocd/ghcr-image-updater
      default: true

serviceAccount:
  create: true
  name: argocd-image-updater

metrics:
  enabled: false

rbac:
  enabled: true

# Memory bound (use1 is memory-bound). limit ~1.5x observed 7d peak (~65Mi);
# cpu request only.
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi
