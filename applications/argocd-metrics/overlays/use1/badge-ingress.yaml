# Public Argo CD status badges, for the README and wiki of the public repo.
# Only /api/badge is routed from the internet (external Traefik, Cloudflare
# proxied). The UI and API stay internal (argocd/patches/argocd.vngenterprise.com.yaml).
# The badge endpoint is unauthenticated and shows only an app's sync and health.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-badge-public
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.vngenterprise.com`) && Path(`/api/badge`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
      services:
        - name: argocd-server
          port: 443
  tls:
    store:
      name: default
      namespace: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  namespace: argocd
  name: cloudflare-only
spec:
  # Only accept requests that came through Cloudflare (or from inside the cluster
  # and the LAN). Traefik runs with externalTrafficPolicy=Local, so RemoteAddr is
  # the real L4 source; ipAllowList without ipStrategy matches against it, so
  # anything hitting the origin directly is rejected. Same list as applications/pocket-id/overlays/use1/middleware.yaml,
  # applications/netbird/overlays/use1/middleware.yaml and applications/n8n/overlays/use1/middleware.yaml.
  ipAllowList:
    sourceRange:
      # Internal clients. NetBird DNS resolves *.vngenterprise.com to this
      # Traefik's LAN address (10.1.50.175), so people on the LAN or the mesh
      # arrive with their own private source address, not through Cloudflare:
      # in-cluster pods (Cilium pod CIDR), every LAN VLAN, and NetBird peers.
      - 10.245.0.0/16
      - 10.1.0.0/16
      - 100.64.0.0/10
      # Cloudflare published edge ranges (https://www.cloudflare.com/ips-v4 + ips-v6)
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
