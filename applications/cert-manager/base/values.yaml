installCRDs: false
crds:
  enabled: true
replicaCount: 3
extraArgs:
  - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
  - --dns01-recursive-nameservers-only
# Primary resolver is CoreDNS (kube-dns) so the HTTP-01 self-check honors the
# in-cluster split-horizon rewrites (custom domains whose public IP the cluster
# cannot NAT-reflect on-subnet; see the coredns-config rewrite). DNS-01 self-checks
# are unaffected: they use the explicit --dns01-recursive-nameservers flag above,
# not the pod resolver. Public resolver kept as a fallback.
podDnsPolicy: None
podDnsConfig:
  nameservers:
    - 10.96.0.10
    - 1.1.1.1

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    namespace: cert-manager
    labels:
      instance: primary
    interval: 60s
    scrapeTimeout: 30s
    path: /metrics

# Memory bounds (use1 is memory-bound). limit ~1.5x observed 7d peak working
# set; cpu request only (no cpu limit, avoids throttling). Peaks: controller
# ~91Mi, cainjector ~95Mi, webhook ~67Mi.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 192Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi