apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rooted-in-pages
  namespace: rooted-in-pages
spec:
  secretName: rooted-in-pages-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.rooted-in-pages.com"
  dnsNames:
    - "*.rooted-in-pages.com"
    - rooted-in-pages.com
