# Wasabi credentials for the cupboard barman object store.
#
# Same provider, key layout and naming as the grafana and rustlens databases:
# OpenBao kv at cnpg/<db>/backup with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY,
# projected into a Secret named cnpg-<db>-backup with the ACCESS_KEY_ID /
# ACCESS_SECRET_KEY keys that barmanObjectStore expects.
#
# APPLY THIS BEFORE the backup stanza in cluster.yaml, and confirm it reports
# SecretSynced first. If barman is enabled while these credentials are missing or
# wrong, Postgres archive_command fails, WAL is retained in pg_wal instead of
# being recycled, and it accumulates on the SAME 5Gi volume as the data (there is
# no separate walStorage). That volume currently has ~4.3G free, so a broken
# archive is a slow-motion disk-full outage rather than an immediate error.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-cupboard-backup
  namespace: cupboard-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-cupboard-backup
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg/cupboard/backup
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: cnpg/cupboard/backup
        property: AWS_SECRET_ACCESS_KEY
