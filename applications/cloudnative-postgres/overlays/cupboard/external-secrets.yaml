# App role + password sourced from Vault; CNPG uses this to bootstrap the
# `cupboard` owner role. Vault KV v2 key: cupboard/staging/pg/cupboard
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-pg-bootstrap
  namespace: cupboard-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-pg-bootstrap
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .db_password }}"
  data:
    - secretKey: username
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: username
    - secretKey: db_password
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: db_password
---
# Phase 1: password for the non-owner `cupboard_app` role (CNPG managed role; see
# cluster.yaml). Vault KV v2 key: cupboard/staging/pg/cupboard_app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-app-role
  namespace: cupboard-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-app-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "cupboard_app"
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: cupboard/staging/pg/cupboard_app
        property: db_password
