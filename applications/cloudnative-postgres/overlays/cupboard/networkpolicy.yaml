# Phase 7 PR6 - default-deny (ingress AND egress) for cupboard-db, plus every allow
# that namespace needs. Decision I of docs/phase7-plan.md.
#
# WHY THIS FILE LIVES HERE AND NOT UNDER applications/cupboard/overlays/: the
# cupboard-db namespace is owned by the cnpg-cupboard ArgoCD Application, which syncs
# this overlay. The policy must land with the resources it protects.
#
# ROLLOUT - READ BEFORE APPLYING:
#   cupboard-db is the RISKIEST namespace in the rollout and goes LAST. Every
#   cupboard service that stores anything is behind it, and CNPG's own control
#   traffic (operator -> instance manager, instance manager -> apiserver, pooler ->
#   primary) is easy to under-allow.
#   1. Apply alone, with a CNPG primary that is healthy and NOT mid-failover:
#        kubectl apply -f applications/cloudnative-postgres/overlays/cupboard/networkpolicy.yaml
#   2. Watch for drops, and watch CNPG at the same time:
#        hubble observe --verdict DROPPED --namespace cupboard-db --follow
#        kubectl -n cupboard-db get cluster cupboard -w
#   3. Instant rollback, no side effects:
#        kubectl delete -f applications/cloudnative-postgres/overlays/cupboard/networkpolicy.yaml
#   The default-deny and ALL of its allows live in this ONE file so a single
#   apply/delete flips the namespace atomically. Never split them across files.
#   See applications/cupboard/NETWORKPOLICY-ROLLOUT.md for the ordered plan.
#
# WHAT THIS ALLOWS
#   Ingress: the node (kubelet probes plus CNPG's instance-manager health checks);
#     the cnpg-operator; alloy-metrics for the PodMonitor scrape (:9187 postgres
#     exporter on the instances, :9127 pgbouncer exporter on the poolers); every
#     pod in this namespace (pooler -> primary, and future replica streaming);
#     and exactly five cupboard services on :5432.
#   Egress:  cluster DNS (now with L7 dns visibility), the Wasabi object store on
#     :443, the kube-apiserver (the CNPG instance manager watches its own Cluster
#     resource and reports status), and intra-namespace.
#     The Wasabi rule was added in Phase 7 PR8, which is what the earlier revision
#     of this header flagged as still needed once the cluster gained
#     barmanObjectStore backups. It is load-bearing: if it is removed, WAL
#     archiving fails silently and pg_wal fills the data volume.
#   DENIED BY DESIGN: cupboard-collector and cupboard-metrics have NO Postgres
#     access (decision I). Neither service has a DATABASE_URL; if Hubble shows
#     either of them dropping against :5432, that is a finding, not a missing rule.
#
# WHY THE OPERATOR RULES ARE PORT-UNCONSTRAINED: the ports CNPG uses between the
# operator, the instance manager (:8000), Postgres (:5432) and the metrics exporter
# (:9187) are an implementation detail of the operator version, not a contract.
# cnpg-operator and the node are trusted infrastructure, and pinning their ports here
# buys no isolation while adding a silent-breakage path on every operator upgrade.
#
# TALOS NOTE: the apiserver runs hostNetwork on the control planes, so its identity
# carries both reserved:kube-apiserver and the node identity. If Hubble shows
# apiserver drops after apply, the fix is to add `remote-node` to the toEntities list
# on the kube-apiserver rule below, NOT to widen anything else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cupboard-db-netpol
  namespace: cupboard-db
spec:
  description: "Default-deny both directions for cupboard-db with the phase7 decision-I allow set."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Kubelet probes and any other node-sourced control traffic. Port-unconstrained:
    # CNPG probes the instance manager on :8000, not the service port.
    - fromEntities:
        - host
        - remote-node
    # The CNPG operator manages the instances and the pgbouncer poolers.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-operator
    # Intra-namespace: pooler -> primary on :5432, plus instance-to-instance
    # replication and the instance-manager mesh when replicas are added.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-db
    # The PodMonitor scrape: :9187 is the CNPG postgres exporter on the instances,
    # :9127 the pgbouncer exporter on the poolers.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy-metrics
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
            - port: "9127"
              protocol: TCP
    # The five cupboard services with Postgres access. collector and metrics are
    # deliberately absent.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-gateway
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-auth
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-fleet
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-identity
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-tenant
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # Cluster DNS, WITH the L7 dns visibility rule, which is now REQUIRED: the
    # toFQDNs rule below only works if Cilium can see this namespace's DNS
    # answers. Removing the `rules: dns:` block does not break DNS, it silently
    # breaks the Wasabi egress rule and therefore WAL archiving. This was a plain
    # L4 allow until barman was enabled.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Barman object store egress (Wasabi). Without this, archive_command fails,
    # Postgres stops recycling WAL, and pg_wal grows on the SAME 5Gi volume as the
    # data until the database goes down. The PR6 header called this out as the rule
    # to add "when the production cluster gains S3 backups".
    #
    # Keep both exact and wildcard names: barman/boto3 may address the bucket
    # virtual-hosted style (cnpg-cupboard-use1.s3.us-east-1.wasabisys.com) as well
    # as path style (s3.us-east-1.wasabisys.com). The apex covers the canonical
    # name currently returned by Wasabi DNS.
    - toFQDNs:
        - matchName: wasabisys.com
        - matchName: s3.us-east-1.wasabisys.com
        - matchPattern: "*.wasabisys.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Fallback for use1: the 2026-08-03 preflight showed that this namespace's DNS
    # answers were not entering Cilium's FQDN cache. All returned Wasabi us-east-1
    # endpoint addresses were inside this /24. Keep the FQDN rule above for when
    # cache integration is repaired; revalidate this CIDR during Cilium/Wasabi
    # changes rather than widening database egress to all of world:443.
    - toCIDR:
        - 38.27.106.0/24
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The CNPG instance manager watches its Cluster/Pooler resources and writes
    # status back. 443 is the kubernetes.default ClusterIP port, 6443 the real
    # apiserver port that kube-proxy DNATs to (kube-proxy is RETAINED here, so the
    # policy sees the post-DNAT destination).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Intra-namespace: pooler -> primary, and replication when replicas are added.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-db
