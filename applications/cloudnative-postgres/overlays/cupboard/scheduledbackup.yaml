# Twice-daily base backups, 03:00 and 15:00, matching grafana and rustlens.
#
# The CNPG schedule field is a SIX field cron (leading seconds), not the usual
# five. "0 0 3,15 * * *" is 03:00:00 and 15:00:00, NOT every 3rd and 15th minute.
#
# Base backups alone are not the recovery story: continuous WAL archiving from
# the cluster's barmanObjectStore is what provides PITR between them. This
# resource only pins how often a fresh base is taken so recovery does not have to
# replay an unbounded WAL chain.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cupboard-twice-daily
  namespace: cupboard-db
spec:
  schedule: "0 0 3,15 * * *"
  backupOwnerReference: self
  cluster:
    name: cupboard
  method: barmanObjectStore
