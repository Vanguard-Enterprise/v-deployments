apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rustlens
  namespace: rustlens-db
spec:
  # Scaled 3 -> 1 (HA removed) as a deliberate storage/resource optimization on
  # the memory-bound use1 cluster. The app connects only via the rw pooler ->
  # primary (no read-replica dependency); continuous WAL archiving to S3 remains
  # the recovery path. Replica volumes (Retain reclaim policy) are cleaned up
  # manually post-migration.
  instances: 1
  # Single instance: the operator PDB (minAvailable 1 on the primary) can never be
  # satisfied, so it blocks every node drain forever. Drains restart the DB once.
  enablePDB: false
  primaryUpdateStrategy: unsupervised
  # Memory bound. Postgres real (anon) usage is tiny (~80Mi); the multi-GB cgroup
  # figure is reclaimable OS page cache. request covers shared_buffers (CNPG
  # auto-tunes to ~25% of memory) + headroom; limit caps page-cache growth.
  # cpu request only (no cpu limit).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  bootstrap:
    initdb:
      database: rustlens
      owner: rustlens
      secret:
        name: rustlens-pg-bootstrap
  storage:
    size: 20Gi
    storageClass: longhorn
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-rustlens-use1
      endpointURL: https://s3.us-east-1.wasabisys.com
      s3Credentials:
        accessKeyId:
          name: cnpg-rustlens-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-rustlens-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"
