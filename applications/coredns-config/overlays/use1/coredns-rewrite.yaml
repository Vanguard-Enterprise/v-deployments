# Corefile body captured verbatim from kube-system/coredns on 2026-05-12
# (cluster: use1) with one inserted rewrite directive that keeps in-cluster
# netbird-client pods off the public Cloudflare path for netbird.vngenterprise.com.
# Re-capture and update this file before any CoreDNS upgrade that may
# modify the default Corefile shape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        # Keep in-cluster netbird-client pods off the public Cloudflare path.
        # netbird.vngenterprise.com is CF-proxied; CF's ~100s connection cap
        # kept killing the long-lived management/signal gRPC stream (repeated
        # 504s -> ICE agent never initialized -> peers stuck on relay).
        # Resolve it to the in-cluster Traefik service instead; the Host header
        # is unchanged so the existing IngressRoute still routes mgmt/signal/relay.
        rewrite name netbird.vngenterprise.com traefik.traefik.svc.cluster.local
        # Phase 5 custom-domain HTTP-01 dry-run (store.vng.bet). The k8s nodes and
        # the external Traefik LB (10.1.50.175) share subnet 10.1.50.0/24 (VLAN 50),
        # so the gateway cannot NAT-reflect a pod hitting the public WAN IP back to
        # the LB on the same subnet (asymmetric return -> timeout). That breaks
        # cert-manager's in-cluster HTTP-01 self-check even though internet:80 -> LB
        # is forwarded and LE's external validation works. Resolve the domain to the
        # in-cluster Traefik service so the self-check stays on-subnet; the Host header
        # is unchanged so the acme-solver Ingress still routes. Remove after the dry
        # run, or generalize (per-domain automation) for production custom domains.
        rewrite name store.vng.bet traefik.traefik.svc.cluster.local
        # Keep Grafana's server-side requests on the internal Traefik path.
        # The public record may be internal-only or may resolve to a WAN address
        # that the cluster cannot NAT-reflect to itself.
        # Preserve the original Host header so TLS and IngressRoute matching
        # continues to use the public name.
        rewrite name grafana.vngenterprise.com traefik-internal.traefik.svc.cluster.local
        # Apps reach the outbound mail relay (applications/smtp-relay) by the same
        # name LAN and NetBird clients use, so its certificate verifies everywhere.
        # Outside the cluster the name resolves to the MetalLB address 10.1.50.177
        # (NetBird DNS zone).
        rewrite name smtp-relay.vngenterprise.com smtp-relay.smtp-relay.svc.cluster.local
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
