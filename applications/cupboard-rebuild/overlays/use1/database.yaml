apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cupboard
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  bootstrap:
    initdb:
      database: cupboard
      owner: cupboard
  storage:
    size: 20Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi
