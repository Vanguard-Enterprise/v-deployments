apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cupboard
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`cupboard-staging.vngenterprise.com`)
      kind: Rule
      services:
        - name: cupboard-web
          port: 3000
  tls:
    store:
      name: default
      namespace: traefik
