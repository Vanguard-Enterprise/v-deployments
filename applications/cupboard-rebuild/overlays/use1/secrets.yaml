apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-encryption
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-encryption
    creationPolicy: Owner
  data:
    - secretKey: CUPBOARD_SECRET_KEY
      remoteRef:
        key: cupboard/rebuild/staging
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pull-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .mysecret | toString }}"
  data:
    - secretKey: mysecret
      remoteRef:
        key: dockerconfig/aliencord-github
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-storage
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: cupboard/rebuild/staging-s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: cupboard/rebuild/staging-s3
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: CUPBOARD_S3_BUCKET
      remoteRef:
        key: cupboard/rebuild/staging-s3
        property: BUCKET_NAME
