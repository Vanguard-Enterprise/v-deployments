apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cupboard-api
  template:
    metadata:
      labels:
        app: cupboard-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: github-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/vanguard-enterprise/cupboard-api # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cupboard-app
                  key: uri
            - name: CUPBOARD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cupboard-encryption
                  key: CUPBOARD_SECRET_KEY
            - name: CUPBOARD_WEB_ORIGINS
              value: https://cupboard-staging.vngenterprise.com
            # Wasabi bucket cupboard-staging-use1 (us-east-2). Wasabi user svc-cupboard holds
            # only the managed policy cupboard-staging-use1-rw.
            - name: CUPBOARD_S3_ENDPOINT
              value: https://s3.us-east-2.wasabisys.com
            - name: AWS_REGION
              value: us-east-2
            # Country and network lookups cache about 90 MB of public data here.
            - name: CUPBOARD_IP_DATA_DIR
              value: /var/cache/cupboard/ip-data
            - name: CUPBOARD_CLICKHOUSE_URL
              value: http://cupboard-clickhouse:8123
            - name: CUPBOARD_CLICKHOUSE_USER
              value: cupboard
            - name: CUPBOARD_CLICKHOUSE_DATABASE
              value: cupboard
            - name: CUPBOARD_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cupboard-clickhouse
                  key: password
            # Sign-in providers return to the page's own origin, so no redirect
            # base or state prefix is set. Steam only links to existing accounts.
            - name: CUPBOARD_SIGNIN_STEAM
              value: "1"
            # This is the only copy holding the Discord bot's gateway connection.
            # It does nothing until cupboard-discord exists.
            - name: CUPBOARD_DISCORD_GATEWAY
              value: "1"
          # Each integration is all or nothing: its Secret holds every variable
          # it needs, and the API starts without it while the Secret is absent.
          envFrom:
            - secretRef:
                name: cupboard-storage
            - secretRef:
                name: cupboard-steam
                optional: true
            - secretRef:
                name: cupboard-sign-in
                optional: true
            - secretRef:
                name: cupboard-github
                optional: true
            - secretRef:
                name: cupboard-discord
                optional: true
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: ip-data
              mountPath: /var/cache/cupboard/ip-data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: ip-data
          persistentVolumeClaim:
            claimName: cupboard-ip-data
---
# Kept across restarts so a new pod does not download the IP data again.
# The Recreate strategy lets the single-writer volume move between pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cupboard-ip-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cupboard-api
spec:
  selector:
    app: cupboard-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cupboard-web
  template:
    metadata:
      labels:
        app: cupboard-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: github-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/vanguard-enterprise/cupboard-web # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CUPBOARD_API_URL
              value: http://cupboard-api:8080
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cupboard-web
spec:
  selector:
    app: cupboard-web
  ports:
    - name: http
      port: 3000
      targetPort: http
