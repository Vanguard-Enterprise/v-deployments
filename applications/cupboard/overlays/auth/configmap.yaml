apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-auth-config
  namespace: cupboard-auth
# Non-secret config. Secrets (DB URLs, JWT keys, pepper, Discord creds, cookie key)
# come from the ExternalSecret. service.name is hardcoded to "cupboard-auth" in the
# telemetry crate; OTLP export flips on by the presence of OTEL_EXPORTER_OTLP_ENDPOINT.
data:
  BIND_ADDR: "0.0.0.0:8080"
  ENVIRONMENT: "staging"
  DB_MAX_CONNECTIONS: "10"
  RUST_LOG: "info,sqlx=warn,hyper=warn,tower_http=info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4317"
  ACCESS_TOKEN_TTL_SECS: "900"
  REFRESH_TOKEN_TTL_SECS: "2592000"
  # Public dashboard base — used to build invite accept links and the Discord
  # post-login redirect.
  PUBLIC_BASE_URL: "https://cupboard-app-staging.vngenterprise.com"
  # The browser-facing callback registered with the Discord application. Discord login
  # stays inert until DISCORD_CLIENT_ID/SECRET + COOKIE_SIGNING_KEY are set in Vault.
  DISCORD_REDIRECT_URI: "https://cupboard-staging.vngenterprise.com/auth/discord/callback"
  # Phase 5 PR3: the central PUBLIC host serving player OAuth callbacks (Steam return_to).
  # The browser is handed back to the tenant storefront via a one-time code.
  PLAYER_AUTH_CALLBACK_BASE_URL: "https://cupboard-login.vngenterprise.com"
