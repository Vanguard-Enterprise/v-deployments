apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-auth
  namespace: cupboard-auth
spec:
  # Single replica for staging; operators are low-volume. Scale later if needed.
  replicas: 1
  selector:
    matchLabels:
      app: cupboard-auth
  template:
    metadata:
      labels:
        app: cupboard-auth
        app.kubernetes.io/name: cupboard-auth
        app.kubernetes.io/part-of: cupboard
        team: cupboard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      containers:
        - name: auth
          image: ghcr.io/vanguard-enterprise/cupboard-auth:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cupboard-auth-config
            - secretRef:
                name: cupboard-auth-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            # 503 until the owner pool answers SELECT 1 (also proves migrations ran).
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
