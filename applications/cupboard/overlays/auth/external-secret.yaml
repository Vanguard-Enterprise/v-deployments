# Composes the auth service's secret env from Vault:
#   * DATABASE_URL      — owner role (migrations + cross-tenant/system work)
#   * DATABASE_URL_APP  — non-owner cupboard_app role (RLS-enforced request path)
#   * EdDSA JWT keypair — auth signs; the gateway verifies with the public half
#   * TOKEN_PEPPER      — keyed-hashes refresh/invite tokens
#
# Passwords are urlquery-encoded: Vault generates base64 secrets whose '+/=' otherwise
# break sqlx's URL parser; sqlx percent-decodes the userinfo back to the original.
#
# Auth connects to the DIRECT `cupboard-rw` service, NOT `cupboard-pooled-rw`: PgBouncer
# (transaction pooling) drops the libpq `options=-c search_path=auth` startup parameter,
# so through the pooler auth would land in `public` and collide with the gateway's
# `_sqlx_migrations`. A direct connection honors search_path, isolating auth's schema.
# Auth is low-volume (operators), so skipping the pooler is fine.
#
# Discord login + signed cookies are intentionally NOT wired here yet — the service
# treats their absence as "Discord disabled". Add DISCORD_CLIENT_ID/SECRET and
# COOKIE_SIGNING_KEY (from cupboard/staging/auth) here when a Discord app is registered.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-auth-secrets
  namespace: cupboard-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-auth-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .pg_username }}:{{ .pg_password | urlquery }}@cupboard-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        DATABASE_URL_APP: "postgres://cupboard_app:{{ .app_password | urlquery }}@cupboard-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        JWT_PRIVATE_KEY_PEM: "{{ .jwt_private_key }}"
        JWT_PUBLIC_KEY_PEM: "{{ .jwt_public_key }}"
        TOKEN_PEPPER: "{{ .token_pepper }}"
        # Phase 5 PR3: PLAYER (storefront customer) auth. The player JWT keypair is
        # DISJOINT from the operator one above; that separation is the security boundary
        # between the two token populations. Absent => /auth/player/* disabled (503).
        PLAYER_JWT_PRIVATE_KEY_PEM: "{{ .player_jwt_private_key }}"
        PLAYER_JWT_PUBLIC_KEY_PEM: "{{ .player_jwt_public_key }}"
        STEAM_WEB_API_KEY: "{{ .steam_web_api_key }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: username
    - secretKey: pg_password
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: db_password
    - secretKey: app_password
      remoteRef:
        key: cupboard/staging/pg/cupboard_app
        property: db_password
    - secretKey: jwt_private_key
      remoteRef:
        key: cupboard/staging/auth
        property: jwt_private_key
    - secretKey: jwt_public_key
      remoteRef:
        key: cupboard/staging/auth
        property: jwt_public_key
    - secretKey: token_pepper
      remoteRef:
        key: cupboard/staging/auth
        property: token_pepper
    - secretKey: player_jwt_private_key
      remoteRef:
        key: cupboard/staging/auth
        property: player_jwt_private_key
    - secretKey: player_jwt_public_key
      remoteRef:
        key: cupboard/staging/auth
        property: player_jwt_public_key
    # Optional persona/avatar enrichment; login works without it.
    - secretKey: steam_web_api_key
      remoteRef:
        key: cupboard/staging/auth
        property: steam_web_api_key
