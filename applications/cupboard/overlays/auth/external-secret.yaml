# Composes the auth service's secret env from Vault:
#   * DATABASE_URL      — owner role (migrations + cross-tenant/system work)
#   * DATABASE_URL_APP  — non-owner cupboard_app role (RLS-enforced request path)
#   * EdDSA JWT keypair — auth signs; the gateway verifies with the public half
#   * TOKEN_PEPPER      — keyed-hashes refresh/invite tokens
#
# Passwords are urlquery-encoded: Vault generates base64 secrets whose '+/=' otherwise
# break sqlx's URL parser; sqlx percent-decodes the userinfo back to the original.
#
# Discord login + signed cookies are intentionally NOT wired here yet — the service
# treats their absence as "Discord disabled". Add DISCORD_CLIENT_ID/SECRET and
# COOKIE_SIGNING_KEY (from cupboard/staging/auth) here when a Discord app is registered.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-auth-secrets
  namespace: cupboard-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-auth-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .pg_username }}:{{ .pg_password | urlquery }}@cupboard-pooled-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        DATABASE_URL_APP: "postgres://cupboard_app:{{ .app_password | urlquery }}@cupboard-pooled-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        JWT_PRIVATE_KEY_PEM: "{{ .jwt_private_key }}"
        JWT_PUBLIC_KEY_PEM: "{{ .jwt_public_key }}"
        TOKEN_PEPPER: "{{ .token_pepper }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: username
    - secretKey: pg_password
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: db_password
    - secretKey: app_password
      remoteRef:
        key: cupboard/staging/pg/cupboard_app
        property: db_password
    - secretKey: jwt_private_key
      remoteRef:
        key: cupboard/staging/auth
        property: jwt_private_key
    - secretKey: jwt_public_key
      remoteRef:
        key: cupboard/staging/auth
        property: jwt_public_key
    - secretKey: token_pepper
      remoteRef:
        key: cupboard/staging/auth
        property: token_pepper
