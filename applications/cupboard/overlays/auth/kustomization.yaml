apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- configmap.yaml
- github-pull-secret.yaml
- external-secret.yaml
- deployment.yaml
- service.yaml
# argocd-image-updater rewrites this to a pinned digest on each new :main build
# (write-back-target: kustomization). Bootstraps from :main until the first build.
images:
- name: ghcr.io/vanguard-enterprise/cupboard-auth
  digest: sha256:bf52be5efa5d47a94f1e0f74c062b8f1f77aa80748bc4c9939b8904b996892f0
