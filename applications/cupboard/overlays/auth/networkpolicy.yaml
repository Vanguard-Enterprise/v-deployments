# Phase 7 PR6 - default-deny (ingress AND egress) for cupboard-auth, plus every
# allow that namespace needs. Decision I of docs/phase7-plan.md.
#
# ROLLOUT - READ BEFORE APPLYING:
#   1. Apply ONE namespace at a time, never the whole tree at once:
#        kubectl apply -f applications/cupboard/overlays/auth/networkpolicy.yaml
#   2. Watch for drops through a full traffic cycle (10+ minutes of real use;
#      for auth that means at least one operator login and one Steam player login):
#        hubble observe --verdict DROPPED --namespace cupboard-auth --follow
#   3. Instant rollback, no side effects:
#        kubectl delete -f applications/cupboard/overlays/auth/networkpolicy.yaml
#   The default-deny and ALL of its allows live in this ONE file so a single
#   apply/delete flips the namespace atomically. Never split them across files.
#   See applications/cupboard/NETWORKPOLICY-ROLLOUT.md for the ordered plan.
#
# WHAT THIS ALLOWS
#   Ingress: kubelet probes on :8080; the gateway proxy (/auth/*); traefik for the
#     PUBLIC player OAuth callback host (cupboard-login.vngenterprise.com); the
#     tenant service (AUTH_INTERNAL_URL, the plan-change fanout).
#   Egress:  tenant (TENANT_INTERNAL_URL, storefront host -> org resolution),
#     identity (IDENTITY_INTERNAL_URL, the Phase 7 PR2 privacy-coordinator fan-out),
#     Postgres, OTLP, cluster DNS, and the identity-provider internet egress:
#     Discord OAuth, Steam OpenID verification and the Steam Web API.
#   NO Redis: auth reads no REDIS_URL.
#
# FQDN FOOTGUN: toFQDNs only works if Cilium can SEE the DNS answers, so the DNS
# rule below carries an L7 `rules: dns: matchPattern: "*"` block that sends this
# namespace's lookups through the Cilium DNS proxy. Deleting that block does not
# break DNS, it silently breaks every toFQDNs rule underneath it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cupboard-auth-netpol
  namespace: cupboard-auth
spec:
  description: "Default-deny both directions for cupboard-auth with the phase7 decision-I allow set."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Kubelet liveness/readiness probes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The gateway proxies /auth/* here.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Edge: the cupboard-login IngressRoute (Steam/Discord player callbacks only).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # tenant -> auth (AUTH_INTERNAL_URL: billing plan-change fanout, PLAN_WRITE_TOKEN).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-tenant
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Cluster DNS, WITH the L7 dns visibility rule that makes the toFQDNs rules
    # below function. Do not downgrade this to a plain L4 allow.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # auth -> tenant (TENANT_INTERNAL_URL) and auth -> identity (IDENTITY_INTERNAL_URL,
    # the privacy coordinator fan-out added in Phase 7 PR2; it post-dates the
    # decision-I matrix, which lists only auth->tenant).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-tenant
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-identity
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Postgres through the cupboard-pooled-rw pgbouncer.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OTLP export.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy-receiver
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # Identity providers. Discord OAuth token/user endpoints; Steam OpenID
    # verification (steamcommunity.com/openid/login) and the Steam Web API player
    # summaries. discordapp.com is Discord's legacy/CDN domain, kept because avatar
    # and asset URLs still resolve there.
    - toFQDNs:
        - matchName: "discord.com"
        - matchName: "discordapp.com"
        - matchPattern: "*.discordapp.com"
        - matchName: "steamcommunity.com"
        - matchName: "api.steampowered.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
