# ClusterIP only — auth has no ingress. The gateway is the single front door and
# reverse-proxies /auth/* to this service in-cluster.
apiVersion: v1
kind: Service
metadata:
  name: cupboard-auth
  namespace: cupboard-auth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: cupboard-auth
