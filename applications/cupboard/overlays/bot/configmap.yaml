apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-bot-config
  namespace: cupboard-bot
data:
  # In-cluster tenant API base; the bot resolves guild links and entitlements here.
  TENANT_INTERNAL_URL: "http://cupboard-tenant.cupboard-tenant.svc.cluster.local:8080"
  OBSERVABILITY_ENABLED: "true"
  OTEL_SERVICE_NAME: "cupboard-bot"
  OTEL_SERVICE_NAMESPACE: "cupboard"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=use1,team=cupboard"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  DEPLOYMENT_ENV: "use1"
  PYROSCOPE_SERVER_ADDRESS: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4040"
