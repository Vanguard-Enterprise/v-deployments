# Bot-service secrets. REDIS_URL backs the tenant event stream the bot consumes;
# BOT_API_TOKEN is the bot-scoped internal token (decision E: the bot never holds
# the shared INTERNAL_API_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-bot-secrets
  namespace: cupboard-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-bot-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DISCORD_BOT_TOKEN: "{{ .discord_token }}"
        # Password is percent-encoded (urlquery): Vault generates base64 secrets whose
        # '+/=' chars otherwise break URL parsing. Same composition as the tenant overlay.
        REDIS_URL: "redis://:{{ .redis_password | urlquery }}@cupboard-redis-master.cupboard-redis.svc.cluster.local:6379"
        BOT_API_TOKEN: "{{ .bot_api_token }}"
  data:
    - secretKey: discord_token
      remoteRef: { key: cupboard/staging/bot, property: discord_token }
    - secretKey: redis_password
      remoteRef: { key: cupboard/staging/redis, property: password }
    - secretKey: bot_api_token
      remoteRef: { key: cupboard/staging/internal, property: bot_api_token }
