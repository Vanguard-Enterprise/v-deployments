# Collector secrets: the Redis bus + the shared internal token (presented to fleet's
# config feed and identity's enforcement lookup). No database — the Collector is a funnel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-collector-secrets
  namespace: cupboard-collector
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-collector-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .redis_password | urlquery }}@cupboard-redis-master.cupboard-redis.svc.cluster.local:6379"
        INTERNAL_API_TOKEN: "{{ .api_token }}"
  data:
    - secretKey: redis_password
      remoteRef: { key: cupboard/staging/redis, property: password }
    - secretKey: api_token
      remoteRef: { key: cupboard/staging/internal, property: api_token }
