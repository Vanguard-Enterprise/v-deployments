# ClusterIP only — reached in-cluster by the gateway's /ingest/* reverse-proxy (plugin
# and perf-mod pushes; the collector authenticates per-server ingest tokens itself).
# Phase 2 ran the collector without a Service (outbound RCON only); Phase 3's push
# endpoint makes it a target.
apiVersion: v1
kind: Service
metadata:
  name: cupboard-collector
  namespace: cupboard-collector
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: cupboard-collector
