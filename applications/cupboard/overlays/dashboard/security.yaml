apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: cupboard-dashboard-netpol, namespace: cupboard-dashboard}
spec:
  endpointSelector: {}
  enableDefaultDeny: {ingress: true, egress: true}
  ingress:
  - fromEntities: [host, remote-node]
    toPorts: [{ports: [{port: "3000", protocol: TCP}, {port: "4191", protocol: TCP}]}]
  - fromEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: traefik}}]
    toPorts: [{ports: [{port: "3000", protocol: TCP}, {port: "4143", protocol: TCP}]}]
  egress:
  - toEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}}]
    toPorts: [{ports: [{port: "53", protocol: ANY}]}]
  - toEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: cupboard-gateway}}]
    toPorts: [{ports: [{port: "8080", protocol: TCP}, {port: "4143", protocol: TCP}]}]
  - toEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: linkerd}}]
    toPorts: [{ports: [{port: "8080", protocol: TCP}, {port: "8086", protocol: TCP}, {port: "8090", protocol: TCP}]}]
