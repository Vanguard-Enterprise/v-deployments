apiVersion: v1
kind: ConfigMap
metadata: {name: cupboard-dashboard-config, namespace: cupboard-dashboard}
data:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  GATEWAY_URL: http://cupboard-gateway.cupboard-gateway.svc.cluster.local:8080
  NEXT_PUBLIC_BASE_PATH: /app
  ADMIN_HOSTS: cupboard-staging.vngenterprise.com
  SITES_SUFFIX: sites.vngenterprise.com
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cupboard-dashboard, namespace: cupboard-dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: cupboard-dashboard}}
  template:
    metadata: {labels: {app: cupboard-dashboard, app.kubernetes.io/name: cupboard-dashboard, app.kubernetes.io/part-of: cupboard, team: cupboard}}
    spec:
      imagePullSecrets: [{name: github-pull-secret}]
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: dashboard
        image: ghcr.io/vanguard-enterprise/cupboard-dashboard:main
        imagePullPolicy: Always
        ports: [{name: http, containerPort: 3000}]
        envFrom: [{configMapRef: {name: cupboard-dashboard-config}}]
        readinessProbe: {httpGet: {path: /app/login, port: http, httpHeaders: [{name: Host, value: cupboard-staging.vngenterprise.com}]}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /app/login, port: http, httpHeaders: [{name: Host, value: cupboard-staging.vngenterprise.com}]}, initialDelaySeconds: 5, periodSeconds: 20}
        resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: cupboard-dashboard, namespace: cupboard-dashboard}
spec: {selector: {app: cupboard-dashboard}, ports: [{name: http, port: 3000, targetPort: http}]}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: cupboard-dashboard, namespace: cupboard-dashboard, annotations: {kubernetes.io/ingress.class: traefik-internal}}
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`cupboard-staging.vngenterprise.com`) && PathPrefix(`/app`)
    kind: Rule
    priority: 100
    services: [{name: cupboard-dashboard, port: 3000}]
  tls: {store: {name: default, namespace: traefik}}
