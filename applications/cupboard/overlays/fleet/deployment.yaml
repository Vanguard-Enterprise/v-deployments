apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-fleet
  namespace: cupboard-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cupboard-fleet
  template:
    metadata:
      labels:
        app: cupboard-fleet
        app.kubernetes.io/name: cupboard-fleet
        app.kubernetes.io/part-of: cupboard
        team: cupboard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      containers:
        - name: fleet
          image: ghcr.io/vanguard-enterprise/cupboard-fleet:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cupboard-fleet-config
            - secretRef:
                name: cupboard-fleet-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
