apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-fleet
  namespace: cupboard-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cupboard-fleet
  template:
    metadata:
      labels:
        app: cupboard-fleet
        app.kubernetes.io/name: cupboard-fleet
        app.kubernetes.io/part-of: cupboard
        team: cupboard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      # Restricted-PSS-compliant pod hardening (image already runs as uid 10001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet
          image: ghcr.io/vanguard-enterprise/cupboard-fleet:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cupboard-fleet-config
            - secretRef:
                name: cupboard-fleet-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # Drop all privileges; the Rust binary needs no writable root filesystem.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
