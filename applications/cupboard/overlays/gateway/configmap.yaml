apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-gateway-config
  namespace: cupboard-gateway
# Only vars the service actually reads are set here. The telemetry crate
# (crates/telemetry) honors OTEL_EXPORTER_OTLP_ENDPOINT (presence flips it from
# logs-only to logs+traces+metrics over gRPC), ENVIRONMENT (deployment.environment
# resource attr), and RUST_LOG (EnvFilter). service.name is hardcoded to
# "cupboard-gateway" and the OTLP exporter is gRPC via tonic, so OTEL_SERVICE_NAME
# / OTEL_EXPORTER_OTLP_PROTOCOL / sampler vars are intentionally omitted (no-ops).
data:
  BIND_ADDR: "0.0.0.0:8080"
  ENVIRONMENT: "staging"
  DB_MAX_CONNECTIONS: "10"
  # tower_http span is emitted at INFO so it survives the filter and exports as a trace.
  RUST_LOG: "info,sqlx=warn,hyper=warn,tower_http=info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4317"
  # Phase 1: reverse-proxy /auth/* to the auth service (ClusterIP, in-cluster).
  AUTH_SERVICE_URL: "http://cupboard-auth.cupboard-auth.svc.cluster.local:8080"
  # Phase 2: reverse-proxy /fleet/* and /players|bans|evasion/* to the new backends.
  FLEET_SERVICE_URL: "http://cupboard-fleet.cupboard-fleet.svc.cluster.local:8080"
  IDENTITY_SERVICE_URL: "http://cupboard-identity.cupboard-identity.svc.cluster.local:8080"
