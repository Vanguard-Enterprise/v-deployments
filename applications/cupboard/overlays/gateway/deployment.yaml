apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-gateway
  namespace: cupboard-gateway
spec:
  # Single replica for the Phase 0 walking skeleton on the memory-bound cluster.
  # Bump to 2+ in Phase 1 when the gateway carries real auth/routing traffic.
  replicas: 1
  selector:
    matchLabels:
      app: cupboard-gateway
  template:
    metadata:
      labels:
        app: cupboard-gateway
        app.kubernetes.io/name: cupboard-gateway
        app.kubernetes.io/part-of: cupboard
        team: cupboard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      containers:
        - name: gateway
          image: ghcr.io/vanguard-enterprise/cupboard-gateway:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cupboard-gateway-config
            - secretRef:
                name: cupboard-gateway-secrets
          livenessProbe:
            # Liveness: process is up (always 200 unless dead). Don't gate on the DB.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            # Readiness: DB reachable (returns 503 until the pool answers SELECT 1).
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi   # Rust is frugal; cluster is memory-bound
