# Composes DATABASE_URL (pointing at the CNPG rw pooler) from the Vault pg creds.
# Same Vault key as the CNPG bootstrap secret, so app role == cluster owner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-gateway-secrets
  namespace: cupboard-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-gateway-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .pg_username }}:{{ .pg_password }}@cupboard-pooled-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
  data:
    - secretKey: pg_username
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: username
    - secretKey: pg_password
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: db_password
