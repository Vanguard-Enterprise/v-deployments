# Composes DATABASE_URL (pointing at the CNPG rw pooler) from the Vault pg creds.
# Same Vault key as the CNPG bootstrap secret, so app role == cluster owner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-gateway-secrets
  namespace: cupboard-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-gateway-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Password is percent-encoded (urlquery): Vault generates base64 secrets
        # whose '+/=' chars otherwise break sqlx's URL parser ("invalid port number").
        # sqlx percent-decodes the userinfo, recovering the original password.
        DATABASE_URL: "postgres://{{ .pg_username }}:{{ .pg_password | urlquery }}@cupboard-pooled-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        # Phase 1: the EdDSA public key the gateway uses to verify access tokens minted
        # by the auth service. Auth holds the private half; the gateway can only verify.
        JWT_PUBLIC_KEY_PEM: "{{ .jwt_public_key }}"
        REDIS_URL: "redis://:{{ .redis_password | urlquery }}@cupboard-redis-master.cupboard-redis.svc.cluster.local:6379"
        # The gateway presents this to auth's /internal/api-keys/exchange (gateway->auth
        # api-key exchange on the shared internal plane). Residual: a popped gateway gains
        # internal-route access, mitigated by /api/v1 being VPN-only.
        INTERNAL_API_TOKEN: "{{ .internal_api_token }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: username
    - secretKey: pg_password
      remoteRef:
        key: cupboard/staging/pg/cupboard
        property: db_password
    - secretKey: jwt_public_key
      remoteRef:
        key: cupboard/staging/auth
        property: jwt_public_key
    - secretKey: redis_password
      remoteRef:
        key: cupboard/staging/redis
        property: password
    - secretKey: internal_api_token
      remoteRef:
        key: cupboard/staging/internal
        property: api_token
