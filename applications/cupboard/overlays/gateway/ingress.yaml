# Internal-only: reachable over the NetBird VPN via traefik-internal, not the
# public edge. The gateway's /healthz + /readyz are unauthenticated in Phase 0,
# so they stay off the internet. TLS served by the default store's
# *.vngenterprise.com wildcard cert (DNS-01), same as grafana/pelican.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cupboard-gateway
  namespace: cupboard-gateway
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cupboard-staging.vngenterprise.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 200
      middlewares:
        - name: cupboard-api-strip
      services:
        - name: cupboard-gateway
          port: 8080
  tls:
    store:
      name: default
      namespace: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cupboard-api-strip
  namespace: cupboard-gateway
spec:
  stripPrefix:
    prefixes: [/api]
