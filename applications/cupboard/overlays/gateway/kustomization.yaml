apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- configmap.yaml
- github-pull-secret.yaml
- external-secret.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
# argocd-image-updater rewrites this entry to a pinned digest on each new :main
# build (write-back-target: kustomization). Bootstraps from the :main tag until
# the first image is built and detected.
images:
- name: ghcr.io/vanguard-enterprise/cupboard-gateway
  digest: sha256:c572b4097c0e05a2136d0f75a90e726ec94d43eec21f10a9ca24ee3745b789a4
