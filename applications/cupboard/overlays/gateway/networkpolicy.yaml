# Phase 7 PR6 - default-deny (ingress AND egress) for cupboard-gateway, plus every
# allow that namespace needs. Decision I of docs/phase7-plan.md.
#
# ROLLOUT - READ BEFORE APPLYING:
#   1. Apply ONE namespace at a time, never the whole tree at once:
#        kubectl apply -f applications/cupboard/overlays/gateway/networkpolicy.yaml
#   2. Watch for drops through a full traffic cycle (10+ minutes of real use):
#        hubble observe --verdict DROPPED --namespace cupboard-gateway --follow
#   3. Instant rollback, no side effects:
#        kubectl delete -f applications/cupboard/overlays/gateway/networkpolicy.yaml
#   The default-deny and ALL of its allows live in this ONE file so a single
#   apply/delete flips the namespace atomically. Never split them across files:
#   an allow-less default-deny landing on its own blackholes the namespace.
#   See applications/cupboard/NETWORKPOLICY-ROLLOUT.md for the ordered plan.
#
# WHAT THIS ALLOWS
#   Ingress: kubelet probes (/healthz, /readyz on :8080) from the node; traefik
#     (cupboard-staging.vngenterprise.com IngressRoute); the web BFF's SSR calls.
#   Egress:  the proxy fan-out to all six backends on :8080; Postgres via the
#     cupboard-db pooler; Redis; OTLP traces/metrics to alloy-receiver; cluster DNS.
#   The gateway needs NO internet egress: every upstream it talks to is in-cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cupboard-gateway-netpol
  namespace: cupboard-gateway
spec:
  description: "Default-deny both directions for cupboard-gateway with the phase7 decision-I allow set."
  # Every endpoint in this namespace.
  endpointSelector: {}
  # Explicit so intent survives future edits: both directions are default-deny even
  # if a rule list below is ever emptied.
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Kubelet liveness/readiness probes arrive from the node itself. remote-node is
    # included because Cilium gives other cluster nodes a distinct identity and
    # node-sourced (SNAT'd) health traffic would otherwise be dropped.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Public/internal edge: the cupboard-gateway IngressRoute (traefik-internal).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The web BFF calls the gateway server-side over ClusterIP (GATEWAY_URL).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-web
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-dashboard
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # PR7: kubelet probes for the linkerd-proxy sidecar itself, on its admin
    # port. Without this the proxy never reports ready, so the POD never becomes
    # ready and the rollout hangs. Easy to miss: the proxy has its own
    # liveness/readiness/startup probes on :4191, separate from the app's port.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4191"
              protocol: TCP
    # PR7: meshed-to-meshed traffic does NOT arrive on the app's port. The
    # outbound proxy dials the peer's inbound proxy on 4143 and carries the
    # original port in Linkerd's transport header, so a rule scoped to :8080
    # never matches and the SYN is dropped. Same peers as the app-port rules
    # above, so this widens no namespace pair, only the port they meet on.
    # Per-port and per-identity authorization is enforced by Linkerd's
    # Server/AuthorizationPolicy on top of this, not by L4 any more.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-web
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-dashboard
      toPorts:
        - ports:
            - port: "4143"
              protocol: TCP
    # PR7: traefik is meshed, so once it talks to a meshed pod in this
    # namespace the connection lands on the inbound proxy's :4143, not on the
    # app port allowed above. Same source (ns traefik), different port.
    # NOTE the ACME HTTP-01 solver in cupboard-web is deliberately NOT meshed
    # (linkerd.io/inject=disabled via the ClusterIssuer podTemplate), so solver
    # traffic still arrives on :8089 and its existing rule is untouched.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "4143"
              protocol: TCP
  egress:
    # Cluster DNS. Required first: every ClusterIP name below is resolved here.
    # Plain L4 (no L7 dns rules) because this namespace uses no toFQDNs.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # The proxy fan-out (AUTH/FLEET/IDENTITY/COLLECTOR/METRICS/TENANT_SERVICE_URL).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-auth
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-fleet
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-identity
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-collector
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-metrics
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-tenant
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Postgres through the cupboard-pooled-rw pgbouncer (and the primary behind it).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Redis streams bus.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # OTLP export (logs/traces/metrics) to the alloy receiver.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy-receiver
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # PR7: the linkerd-proxy sidecar's own calls to the control plane. Every
    # meshed namespace needs this; under PR6's default-deny egress the proxy
    # otherwise cannot fetch an identity and the pod never goes ready.
    #   :8080 linkerd-identity    (CSR -> workload cert)
    #   :8086 linkerd-destination (service discovery)
    #   :8090 linkerd-policy      (inbound authz policy)
    # These are HEADLESS services, so the proxy dials control-plane pod IPs
    # directly. That is why this is a toEndpoints rule and not toServices.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: linkerd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8086"
              protocol: TCP
            - port: "8090"
              protocol: TCP
    # PR7: meshed-to-meshed traffic does NOT arrive on the app's port. The
    # outbound proxy dials the peer's inbound proxy on 4143 and carries the
    # original port in Linkerd's transport header, so a rule scoped to :8080
    # never matches and the SYN is dropped. Same peers as the app-port rules
    # above, so this widens no namespace pair, only the port they meet on.
    # Per-port and per-identity authorization is enforced by Linkerd's
    # Server/AuthorizationPolicy on top of this, not by L4 any more.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-auth
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-collector
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-fleet
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-identity
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-metrics
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-tenant
      toPorts:
        - ports:
            - port: "4143"
              protocol: TCP
