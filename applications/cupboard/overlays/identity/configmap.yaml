apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-identity-config
  namespace: cupboard-identity
data:
  BIND_ADDR: "0.0.0.0:8080"
  ENVIRONMENT: "staging"
  DB_MAX_CONNECTIONS: "10"
  RUST_LOG: "info,sqlx=warn,hyper=warn,tower_http=info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4317"
  # Phase 4: fleet's internal API, for the BM import's servers phase (auth rides the
  # shared INTERNAL_API_TOKEN from the secret).
  FLEET_INTERNAL_URL: "http://cupboard-fleet.cupboard-fleet.svc.cluster.local:8080"
