# Identity secrets. Connects DIRECT (cupboard-rw) — owns the `identity` schema via
# search_path. VALUE_PEPPER is the single global HMAC pepper for identifier/signal
# value_hash + ban subject_hash. REDIS_URL is the ingestion consumer's bus.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-identity-secrets
  namespace: cupboard-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-identity-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .pg_username }}:{{ .pg_password | urlquery }}@cupboard-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        DATABASE_URL_APP: "postgres://cupboard_app:{{ .app_password | urlquery }}@cupboard-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        JWT_PUBLIC_KEY_PEM: "{{ .jwt_public_key }}"
        VALUE_PEPPER: "{{ .value_pepper }}"
        REDIS_URL: "redis://:{{ .redis_password | urlquery }}@cupboard-redis-master.cupboard-redis.svc.cluster.local:6379"
        INTERNAL_API_TOKEN: "{{ .api_token }}"
        IDENTITY_MASTER_KEY: "{{ .identity_master_key }}"
  data:
    - secretKey: pg_username
      remoteRef: { key: cupboard/staging/pg/cupboard, property: username }
    - secretKey: pg_password
      remoteRef: { key: cupboard/staging/pg/cupboard, property: db_password }
    - secretKey: app_password
      remoteRef: { key: cupboard/staging/pg/cupboard_app, property: db_password }
    - secretKey: jwt_public_key
      remoteRef: { key: cupboard/staging/auth, property: jwt_public_key }
    - secretKey: value_pepper
      remoteRef: { key: cupboard/staging/identity, property: value_pepper }
    - secretKey: redis_password
      remoteRef: { key: cupboard/staging/redis, property: password }
    - secretKey: api_token
      remoteRef: { key: cupboard/staging/internal, property: api_token }
    # Phase 4: envelope master key wrapping per-tenant BattleMetrics token data keys
    # (cupboard-crypto::envelope). Absent => BM integration disabled (503 + no runner).
    - secretKey: identity_master_key
      remoteRef: { key: cupboard/staging/identity, property: master_key }
