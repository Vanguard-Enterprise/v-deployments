# ClusterIP only — reached in-cluster (gateway proxy / Collector internal calls).
apiVersion: v1
kind: Service
metadata:
  name: cupboard-identity
  namespace: cupboard-identity
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: cupboard-identity
