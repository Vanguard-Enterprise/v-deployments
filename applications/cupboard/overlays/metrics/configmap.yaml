apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-metrics-config
  namespace: cupboard-metrics
data:
  BIND_ADDR: "0.0.0.0:8080"
  ENVIRONMENT: "staging"
  RUST_LOG: "info,sqlx=warn,hyper=warn,tower_http=info"
  # Presence flips telemetry from logs-only to logs+traces+metrics; the perf gauges this
  # service records export here → Mimir.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.alloy-receiver.svc.cluster.local:4317"
