# Metrics secrets. No database — it consumes the perf stream from Redis and re-emits
# OTel gauges. REDIS_URL is the bus (consumer group `metrics`); JWT_PUBLIC_KEY_PEM
# verifies access tokens on the tenant-scoped /perf API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-metrics-secrets
  namespace: cupboard-metrics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-metrics-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .redis_password | urlquery }}@cupboard-redis-master.cupboard-redis.svc.cluster.local:6379"
        JWT_PUBLIC_KEY_PEM: "{{ .jwt_public_key }}"
  data:
    - secretKey: redis_password
      remoteRef: { key: cupboard/staging/redis, property: password }
    - secretKey: jwt_public_key
      remoteRef: { key: cupboard/staging/auth, property: jwt_public_key }
