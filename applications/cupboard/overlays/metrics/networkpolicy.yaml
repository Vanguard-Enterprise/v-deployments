# Phase 7 PR6 - default-deny (ingress AND egress) for cupboard-metrics, plus every
# allow that namespace needs. Decision I of docs/phase7-plan.md.
#
# ROLLOUT - READ BEFORE APPLYING:
#   1. Apply ONE namespace at a time, never the whole tree at once:
#        kubectl apply -f applications/cupboard/overlays/metrics/networkpolicy.yaml
#   2. Watch for drops through a full traffic cycle (10+ minutes of real use):
#        hubble observe --verdict DROPPED --namespace cupboard-metrics --follow
#   3. Instant rollback, no side effects:
#        kubectl delete -f applications/cupboard/overlays/metrics/networkpolicy.yaml
#   The default-deny and ALL of its allows live in this ONE file so a single
#   apply/delete flips the namespace atomically. Never split them across files.
#   See applications/cupboard/NETWORKPOLICY-ROLLOUT.md for the ordered plan.
#
# WHAT THIS ALLOWS
#   Ingress: kubelet probes on :8080; the gateway proxy (/perf/*).
#   Egress:  Redis, OTLP, cluster DNS. Nothing else.
#   This is the smallest surface in the fleet and therefore the recommended FIRST
#   namespace to enforce: cupboard-metrics reads its perf samples off the Redis
#   stream and records gauges through OTLP. It holds no player PII, has no
#   DATABASE_URL (decision I denies it Postgres outright), calls no other cupboard
#   service, and needs no internet egress. If a mistake is going to be made in this
#   rollout, make it here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cupboard-metrics-netpol
  namespace: cupboard-metrics
spec:
  description: "Default-deny both directions for cupboard-metrics with the phase7 decision-I allow set."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Kubelet liveness/readiness probes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # PR7: kubelet probes for the linkerd-proxy sidecar itself, on its admin
    # port. Without this the proxy never reports ready, so the POD never becomes
    # ready and the rollout hangs. Easy to miss: the proxy has its own
    # liveness/readiness/startup probes on :4191, separate from the app's :8080.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4191"
              protocol: TCP
    # The gateway proxies /perf/* here.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Cluster DNS. Plain L4 (no L7 dns rules) because this namespace uses no toFQDNs.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Redis streams bus (perf sample consumer group).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # OTLP export (the perf gauges this service records).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy-receiver
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # PR7: the linkerd-proxy sidecar's own calls to the control plane. Every
    # meshed namespace needs this; under PR6's default-deny egress the proxy
    # otherwise cannot fetch an identity and the pod never goes ready.
    #   :8080 linkerd-identity   (CSR -> workload cert)
    #   :8086 linkerd-destination (service discovery)
    #   :8090 linkerd-policy      (inbound authz policy)
    # These are HEADLESS services, so the proxy dials control-plane pod IPs
    # directly. That is why this is a toEndpoints rule and not toServices.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: linkerd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8086"
              protocol: TCP
            - port: "8090"
              protocol: TCP
