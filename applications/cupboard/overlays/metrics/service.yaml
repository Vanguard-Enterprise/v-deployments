# ClusterIP only — reached in-cluster by the gateway's /perf/* reverse-proxy.
apiVersion: v1
kind: Service
metadata:
  name: cupboard-metrics
  namespace: cupboard-metrics
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: cupboard-metrics
