# Tenant-service secrets. Connects DIRECT (cupboard-rw) — owns the `tenant` schema via
# search_path. REDIS_URL backs the public site-resolve cache (best-effort; the service
# degrades to Postgres-only when Redis is down).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-tenant-secrets
  namespace: cupboard-tenant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-tenant-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .pg_username }}:{{ .pg_password | urlquery }}@cupboard-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        DATABASE_URL_APP: "postgres://cupboard_app:{{ .app_password | urlquery }}@cupboard-rw.cupboard-db.svc.cluster.local:5432/cupboard?sslmode=require"
        JWT_PUBLIC_KEY_PEM: "{{ .jwt_public_key }}"
        REDIS_URL: "redis://:{{ .redis_password | urlquery }}@cupboard-redis-master.cupboard-redis.svc.cluster.local:6379"
        TENANT_MASTER_KEY: "{{ .tenant_master_key }}"
        INTERNAL_API_TOKEN: "{{ .internal_api_token }}"
        # Phase 7 PR2: scoped token required on /internal/privacy/* (decision F).
        PRIVACY_TOKEN: "{{ .privacy_token }}"
        # Phase 5 PR4: verify PLAYER tokens (checkout + entitlement reads). Public half of
        # the disjoint player keypair; absent => /player/* returns 503.
        PLAYER_JWT_PUBLIC_KEY_PEM: "{{ .player_jwt_public_key }}"
        # Phase 6 PR2: platform Stripe billing (operator plan subscriptions) + the scoped
        # token auth uses to push plan changes into tenant.
        STRIPE_SECRET_KEY: "{{ .stripe_secret_key }}"
        STRIPE_WEBHOOK_SECRET: "{{ .stripe_webhook_secret }}"
        PLAN_WRITE_TOKEN: "{{ .plan_write_token }}"
        # Phase 6 PR4: bot-scoped internal token; tenant verifies what the bot presents
        # (decision E: the bot never holds the shared INTERNAL_API_TOKEN).
        BOT_API_TOKEN: "{{ .bot_api_token }}"
  data:
    - secretKey: pg_username
      remoteRef: { key: cupboard/staging/pg/cupboard, property: username }
    - secretKey: pg_password
      remoteRef: { key: cupboard/staging/pg/cupboard, property: db_password }
    - secretKey: app_password
      remoteRef: { key: cupboard/staging/pg/cupboard_app, property: db_password }
    - secretKey: jwt_public_key
      remoteRef: { key: cupboard/staging/auth, property: jwt_public_key }
    - secretKey: redis_password
      remoteRef: { key: cupboard/staging/redis, property: password }
    # Phase 5 PR2: envelope master key wrapping per-tenant store provider credentials
    # (cupboard-crypto::envelope). Absent => commerce disabled (no runner, connect 503).
    - secretKey: tenant_master_key
      remoteRef: { key: cupboard/staging/tenant, property: master_key }
    # Guards /internal/sites/resolve, called by auth during player login.
    - secretKey: internal_api_token
      remoteRef: { key: cupboard/staging/internal, property: api_token }
    - secretKey: privacy_token
      remoteRef: { key: cupboard/staging/internal, property: privacy_token }
    - secretKey: player_jwt_public_key
      remoteRef: { key: cupboard/staging/auth, property: player_jwt_public_key }
    - secretKey: stripe_secret_key
      remoteRef: { key: cupboard/staging/stripe, property: secret_key }
    - secretKey: stripe_webhook_secret
      remoteRef: { key: cupboard/staging/stripe, property: webhook_signing_secret }
    - secretKey: plan_write_token
      remoteRef: { key: cupboard/staging/internal, property: plan_write_token }
    - secretKey: bot_api_token
      remoteRef: { key: cupboard/staging/internal, property: bot_api_token }
