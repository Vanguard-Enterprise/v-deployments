# Phase 5 PR4: PUBLIC provider-webhook receiver. Only /webhooks/{provider}/{connection_id}
# is browser/provider-facing on this host; every other tenant endpoint is cluster-internal
# (via the gateway). Signatures HMAC the raw body, so this must NOT go through the gateway
# proxy (which re-serializes); providers post here directly. Covered by the
# *.vngenterprise.com wildcard in the default TLS store.
#
# DO NOT apply before the cupboard-tenant image with the /webhooks route is live and the
# cupboard-hooks DNS record exists.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cupboard-hooks
  namespace: cupboard-tenant
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cupboard-hooks.vngenterprise.com`) && PathPrefix(`/webhooks/`)
      kind: Rule
      services:
        - name: cupboard-tenant
          port: 8080
  tls:
    store:
      name: default
      namespace: traefik
