# Phase 7 PR6 - default-deny (ingress AND egress) for cupboard-tenant, plus every
# allow that namespace needs. Decision I of docs/phase7-plan.md.
#
# ROLLOUT - READ BEFORE APPLYING:
#   1. Apply ONE namespace at a time, never the whole tree at once:
#        kubectl apply -f applications/cupboard/overlays/tenant/networkpolicy.yaml
#   2. Watch for drops through a full traffic cycle (10+ minutes of real use; for
#      tenant that means a storefront page load, a webhook delivery and one
#      domains_loop tick that writes a Certificate):
#        hubble observe --verdict DROPPED --namespace cupboard-tenant --follow
#   3. Instant rollback, no side effects:
#        kubectl delete -f applications/cupboard/overlays/tenant/networkpolicy.yaml
#   The default-deny and ALL of its allows live in this ONE file so a single
#   apply/delete flips the namespace atomically. Never split them across files.
#   See applications/cupboard/NETWORKPOLICY-ROLLOUT.md for the ordered plan.
#
# WHAT THIS ALLOWS
#   Ingress: kubelet probes on :8080; the gateway proxy (/sites, /store, /public);
#     traefik for the PUBLIC provider-webhook host (cupboard-hooks.vngenterprise.com,
#     which deliberately bypasses the gateway so HMAC bodies stay byte-exact); the
#     Discord bot; auth (privacy fan-out and player-account lookups).
#   Egress:  auth + identity on :8080, Postgres, Redis, OTLP, cluster DNS, the
#     kube-apiserver (the domains loop creates cert-manager Certificates and traefik
#     IngressRoutes in cupboard-web), and the commerce providers on :443.
#   The bot -> tenant ingress is the ONLY inbound path granted to cupboard-bot
#     anywhere in the fleet: it mirrors the BOT_API_TOKEN blast radius at the
#     network layer (decision I).
#
# FQDN FOOTGUN: toFQDNs only works if Cilium can SEE the DNS answers, so the DNS
# rule below carries an L7 `rules: dns: matchPattern: "*"` block that sends this
# namespace's lookups through the Cilium DNS proxy. Deleting that block does not
# break DNS, it silently breaks every toFQDNs rule underneath it.
#
# TALOS NOTE: the apiserver runs hostNetwork on the control planes, so its identity
# carries both reserved:kube-apiserver and the node identity. If Hubble shows
# apiserver drops after apply, the fix is to add `remote-node` to the toEntities
# list on the kube-apiserver rule below, NOT to widen anything else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cupboard-tenant-netpol
  namespace: cupboard-tenant
spec:
  description: "Default-deny both directions for cupboard-tenant with the phase7 decision-I allow set."
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Kubelet liveness/readiness probes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The gateway proxies /sites, /store and /public here.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Edge: the cupboard-hooks IngressRoute (provider webhooks, direct not proxied).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The Discord bot (TENANT_INTERNAL_URL, BOT_API_TOKEN). Tenant is the bot's ONLY
    # permitted destination in the whole fleet.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-bot
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # auth -> tenant (TENANT_INTERNAL_URL storefront host resolution, and the
    # PRIVACY_TOKEN export/erase walkers).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-auth
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Cluster DNS, WITH the L7 dns visibility rule that makes the toFQDNs rules
    # below function. Do not downgrade this to a plain L4 allow.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # tenant -> auth (AUTH_INTERNAL_URL) and tenant -> identity (IDENTITY_INTERNAL_URL,
    # ban-appeal lookups; decision O added this var in PR1).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-auth
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-identity
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Postgres through the cupboard-pooled-rw pgbouncer.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Redis streams bus (ticket stream producer, retention XTRIM).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cupboard-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # OTLP export.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: alloy-receiver
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # Custom-domain TLS: the domains loop creates cert-manager Certificates and
    # traefik IngressRoutes in CERT_NAMESPACE (cupboard-web) via the Kubernetes API.
    # 443 is the kubernetes.default ClusterIP port, 6443 the real apiserver port that
    # kube-proxy DNATs to (kube-proxy is RETAINED on this cluster, so the policy sees
    # the post-DNAT destination).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Commerce providers. Stripe (platform billing), PayNow and Tebex (tenant store
    # connections). checkout.stripe.com / pay.paynow.gg / checkout.tebex.io are
    # BROWSER redirect targets, not server-side dials, so they are deliberately absent.
    - toFQDNs:
        - matchName: "api.stripe.com"
        - matchName: "api.paynow.gg"
        - matchName: "headless.tebex.io"
        - matchName: "plugin.tebex.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
