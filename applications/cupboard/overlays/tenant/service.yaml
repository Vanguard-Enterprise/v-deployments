# ClusterIP only — reached in-cluster (gateway proxy; the public webhook IngressRoute
# lands in a later Phase 5 PR).
apiVersion: v1
kind: Service
metadata:
  name: cupboard-tenant
  namespace: cupboard-tenant
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: cupboard-tenant
