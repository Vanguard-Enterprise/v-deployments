apiVersion: v1
kind: ConfigMap
metadata:
  name: cupboard-web-config
  namespace: cupboard-web
# The web BFF calls the gateway server-side over ClusterIP (GATEWAY_URL). The browser
# only needs the public gateway URL for the Discord redirect (NEXT_PUBLIC_*, inlined at
# build time — also set as a build arg if you bake it into the image).
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  GATEWAY_URL: "http://cupboard-gateway.cupboard-gateway.svc.cluster.local:8080"
  NEXT_PUBLIC_GATEWAY_URL: "https://cupboard-staging.vngenterprise.com"
  # Phase 5: host-based routing. The admin dashboard answers only on ADMIN_HOSTS;
  # every other Host header renders as a tenant storefront.
  ADMIN_HOSTS: "cupboard-app-staging.vngenterprise.com"
  SITES_SUFFIX: "sites.vngenterprise.com"
