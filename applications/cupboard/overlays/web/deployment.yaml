apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-web
  namespace: cupboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cupboard-web
  template:
    metadata:
      labels:
        app: cupboard-web
        app.kubernetes.io/name: cupboard-web
        app.kubernetes.io/part-of: cupboard
        team: cupboard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/vanguard-enterprise/cupboard-web:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cupboard-web-config
          # Probes must present the admin Host: kubelet's default Host is the pod
          # IP, which the Phase 5 host-routing middleware classifies as a storefront
          # host (-> 404) rather than the dashboard.
          livenessProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: cupboard-app-staging.vngenterprise.com
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: cupboard-app-staging.vngenterprise.com
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          # Next.js writes to /tmp + .next/cache at runtime, so root stays writable; the
          # rest of the restricted controls still apply.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
