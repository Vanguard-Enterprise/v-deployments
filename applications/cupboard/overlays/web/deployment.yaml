apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupboard-web
  namespace: cupboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cupboard-web
  template:
    metadata:
      labels:
        app: cupboard-web
        app.kubernetes.io/name: cupboard-web
        app.kubernetes.io/part-of: cupboard
        team: cupboard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      containers:
        - name: web
          image: ghcr.io/vanguard-enterprise/cupboard-web:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cupboard-web-config
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
