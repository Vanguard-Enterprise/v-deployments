apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- configmap.yaml
- github-pull-secret.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
# argocd-image-updater rewrites this to a pinned digest on each new :main build.
images:
- name: ghcr.io/vanguard-enterprise/cupboard-web
  newTag: main
