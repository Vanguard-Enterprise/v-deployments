apiVersion: v1
kind: Namespace
metadata:
  name: cupboard-web
  annotations:
    # Phase 7 PR7: mesh this namespace. Injection happens at pod admission, so
    # adding this annotation does nothing until the workload is restarted. That
    # is deliberate: it lets the whole fleet be annotated in one commit while
    # the actual meshing is still rolled out one namespace at a time.
    linkerd.io/inject: enabled
    # Inbound policy is AUDIT: unauthorized requests are logged and still
    # served. Promote to enforcement only once every client of this namespace
    # is itself meshed, otherwise an unmeshed caller has no identity to present
    # and gets rejected.
    config.linkerd.io/default-inbound-policy: audit
  labels:
    # Enforce the restricted Pod Security Standard in this namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
