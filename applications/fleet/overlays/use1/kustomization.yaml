apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet
resources:
  - namespace.yaml
  - secrets.yaml
  - networkpolicy.yaml
  - mysql.yaml
  - mysql-backup.yaml
  - redis.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
helmCharts:
  - name: fleet
    repo: https://fleetdm.github.io/fleet/charts
    version: v7.0.32
    releaseName: fleet
    namespace: fleet
    valuesFile: values.yaml
patches:
  # Argo CD, not Helm, orders this install. The chart's Helm hooks would run the
  # migration job as a PreSync hook, before MySQL exists on the first sync. Run it as
  # an Argo Sync hook in wave 1 instead (after MySQL and Redis in wave -1), and
  # start the server in wave 2. The SA, Role and RoleBinding become plain resources.
  - path: patches/migration-job.yaml
    target:
      kind: Job
      name: fleet-migration
  - path: patches/strip-helm-hooks.yaml
    target:
      kind: (ServiceAccount|Role|RoleBinding)
      name: fleet
  # Restricted Pod Security: the chart sets container-level hardening but not the
  # pod seccomp profile, and leaves the migration job container unhardened.
  - path: patches/pod-security.yaml
    target:
      kind: Deployment
      name: fleet
  - path: patches/vuln-cron-security.yaml
    target:
      kind: CronJob
      name: fleet-vulnprocessing
