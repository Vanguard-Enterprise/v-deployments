# Nightly logical backup of the Fleet database to Wasabi:
#   s3://fleet-use1/mysql-backups/fleet-<UTC timestamp>.sql.gz, kept 30 days.
# This is on top of the Longhorn volume backups. Restore:
#   gunzip -c fleet-<ts>.sql.gz | kubectl -n fleet exec -i fleet-mysql-0 -- \
#     sh -c 'mysql -ufleet -p"$MYSQL_PASSWORD" fleet'
# then make sure Fleet runs with the same server_private_key (secrets.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-mysql-backup
spec:
  schedule: "30 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: fleet-mysql-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: mysql:8.4.13
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  f="/backup/fleet-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  mysqldump -h fleet-mysql -u fleet --single-transaction --quick \
                    --set-gtid-purged=OFF --no-tablespaces --max-allowed-packet=512M fleet \
                    | gzip -6 > "$f"
                  # A dump that does not end with the completion marker is truncated.
                  gunzip -c "$f" | tail -n 1 | grep -q "Dump completed"
                  ls -l "$f"
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: fleet-mysql
                      key: mysql-password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
          containers:
            - name: upload
              image: rclone/rclone:1.76.0
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  rclone copy /backup wasabi:fleet-use1/mysql-backups/
                  rclone delete --min-age 30d wasabi:fleet-use1/mysql-backups/
                  rclone lsl wasabi:fleet-use1/mysql-backups/ | tail -n 3
              env:
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                - name: RCLONE_CONFIG_WASABI_TYPE
                  value: s3
                - name: RCLONE_CONFIG_WASABI_PROVIDER
                  value: Wasabi
                - name: RCLONE_CONFIG_WASABI_ENDPOINT
                  value: s3.us-east-2.wasabisys.com
                - name: RCLONE_CONFIG_WASABI_REGION
                  value: us-east-2
                - name: RCLONE_CONFIG_WASABI_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: fleet-s3
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_WASABI_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fleet-s3
                      key: AWS_SECRET_ACCESS_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
