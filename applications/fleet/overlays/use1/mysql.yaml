# Fleet's database: one MySQL 8.4 instance (Fleet supports a single writer; it is
# tested on 8.4.8). Backups: the Longhorn recurring jobs (default group, hourly to
# monthly) snapshot the volume, and mysql-backup.yaml writes a nightly logical dump
# to Wasabi. A restore also needs server_private_key (see secrets.yaml).
apiVersion: v1
kind: Service
metadata:
  name: fleet-mysql
spec:
  selector:
    app: fleet-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-mysql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: fleet-mysql
  replicas: 1
  selector:
    matchLabels:
      app: fleet-mysql
  template:
    metadata:
      labels:
        app: fleet-mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4.13
          args:
            # Fleet stores Apple MDM bootstrap packages in MySQL.
            - --max-allowed-packet=536870912
            # Same GTID settings Fleet develops and tests against.
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            - --binlog-expire-logs-seconds=259200
            - --innodb-buffer-pool-size=256M
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_DATABASE
              value: fleet
            - name: MYSQL_USER
              value: fleet
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql
                  key: mysql-root-password
          ports:
            - name: mysql
              containerPort: 3306
          # The first start initializes the data directory with networking off,
          # so allow up to 10 minutes before the port opens.
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
