# Pocket ID gate in front of the Fleet console (Fleet's SSO is SAML-only and
# Pocket ID is OIDC-only, so Fleet cannot use Pocket ID itself). Traefik calls this
# as forwardAuth on every console request (ingress.yaml); only members of the Pocket
# ID group fleet_admins get through, and then Fleet asks for its own login.
apiVersion: v1
kind: Service
metadata:
  name: fleet-oauth2-proxy
spec:
  selector:
    app: fleet-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-oauth2-proxy
  template:
    metadata:
      labels:
        app: fleet-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --provider-display-name=Pocket ID
            - --oidc-issuer-url=https://id.vngenterprise.com
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=fleet_admins
            - --email-domain=*
            - --code-challenge-method=S256
            - --redirect-url=https://fleet.vngenterprise.com/oauth2/callback
            # forwardAuth mode: answer 202 when signed in, otherwise redirect to
            # Pocket ID. Traefik passes that redirect to the browser.
            - --upstream=static://202
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --cookie-name=_fleet_gate
            - --cookie-domain=fleet.vngenterprise.com
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --whitelist-domain=fleet.vngenterprise.com
            - --silence-ping-logging=true
          envFrom:
            - secretRef:
                name: fleet-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
