# Everything comes from OpenBao (ClusterSecretStore vault-backend):
#   kv/fleet/use1          mysql passwords, server_private_key, license_key
#   kv/fleet/s3            Wasabi key for bucket fleet-use1 (us-east-2)
#   kv/fleet/oauth2-proxy  Pocket ID client "Fleet" and the proxy cookie secret
#
# server_private_key encrypts the MDM certificates and keys Fleet stores in MySQL
# (APNs, SCEP, ABM, Windows WSTEP). A database restore without this exact key loses
# them, and every enrolled MDM device has to be re-enrolled. Never rotate it casually.
#
# windows_wstep_cert/key is the Windows MDM identity pair. Fleet encrypts escrowed
# BitLocker recovery keys with it, so replacing it loses every escrowed key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-mysql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: fleet-mysql
    creationPolicy: Owner
  data:
    - secretKey: mysql-password
      remoteRef:
        key: fleet/use1
        property: mysql_password
    - secretKey: mysql-root-password
      remoteRef:
        key: fleet/use1
        property: mysql_root_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: fleet-server
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: fleet/use1
        property: server_private_key
    - secretKey: license-key
      remoteRef:
        key: fleet/use1
        property: license_key
    - secretKey: wstep-cert
      remoteRef:
        key: fleet/use1
        property: windows_wstep_cert
    - secretKey: wstep-key
      remoteRef:
        key: fleet/use1
        property: windows_wstep_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: fleet-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: fleet/s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: fleet/s3
        property: AWS_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-oauth2-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: fleet-oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: fleet/oauth2-proxy
        property: client_id
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: fleet/oauth2-proxy
        property: client_secret
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: fleet/oauth2-proxy
        property: cookie_secret
