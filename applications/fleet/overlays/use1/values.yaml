# Fleet chart values (https://github.com/fleetdm/fleet/tree/main/charts/fleet).
# MySQL, Redis and TLS are ours (mysql.yaml, redis.yaml, Traefik), not the chart's.
hostName: fleet.vngenterprise.com
replicas: 2
imageTag: v4.94.1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 1Gi

fleet:
  secretName: fleet-server
  autoApplySQLMigrations: true
  tls:
    enabled: false   # Traefik terminates TLS
  logging:
    json: true
  license:
    secretName: fleet-server
    licenseKey: license-key
  # Software installers, bootstrap packages and file carves go to Wasabi. The
  # credentials come from envsFrom below (accessKeyID stays empty here so the chart
  # does not expect a plain-text key in values).
  carving:
    s3:
      bucketName: fleet-use1
      prefix: carves/
      endpointURL: https://s3.us-east-2.wasabisys.com
      region: us-east-2
      forceS3PathStyle: true
  softwareInstallers:
    s3:
      bucketName: fleet-use1
      prefix: software-installers/
      endpointURL: https://s3.us-east-2.wasabisys.com
      region: us-east-2
      forceS3PathStyle: true

# Run vulnerability processing as its own hourly CronJob, so the memory spike of
# loading the feeds does not land on the server pods.
vulnProcessing:
  dedicated: true
  schedule: "15 * * * *"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 2Gi

# osquery status and result logs go to stdout, and from there to Loki.
osquery:
  logging:
    statusPlugin: stdout
    resultPlugin: stdout

database:
  secretName: fleet-mysql
  address: fleet-mysql:3306
  passwordKey: mysql-password
  maxOpenConns: 25
  maxIdleConns: 25

cache:
  address: fleet-redis:6379

environments:
  # Take the client IP from X-Forwarded-For, trusting Traefik (pod CIDR) and the
  # Cloudflare edges, same list as Pocket ID's TRUST_PROXY.
  FLEET_SERVER_TRUSTED_PROXIES: 10.245.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32

envsFrom:
  - name: FLEET_SERVER_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: fleet-server
        key: private-key
  - name: FLEET_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: fleet-s3
        key: AWS_ACCESS_KEY_ID
  - name: FLEET_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: fleet-s3
        key: AWS_SECRET_ACCESS_KEY
  - name: FLEET_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: fleet-s3
        key: AWS_ACCESS_KEY_ID
  - name: FLEET_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: fleet-s3
        key: AWS_SECRET_ACCESS_KEY
