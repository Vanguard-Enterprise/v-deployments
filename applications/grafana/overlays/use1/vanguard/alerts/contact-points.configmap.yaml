apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-contact-points
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  contact-points.yaml: |
    apiVersion: 1
    # Email is the only alert channel. It goes through smtp-relay to the Google
    # Workspace relay, and alerts@ is a Google Group, so who receives alerts is
    # managed in Google Groups.
    contactPoints:
      - orgId: 1
        name: email-alerts
        receivers:
          - uid: email-alerts
            type: email
            settings:
              addresses: alerts@vngenterprise.com
              singleEmail: true
              # Text templates in templates.configmap.yaml.
              subject: '{{ template "email.subject" . }}'
              message: '{{ template "email.message" . }}'

    # Slack contact points provisioned earlier. A contact point dropped from the
    # list above stays in Grafana, so these remove them. Safe to delete this
    # block once Grafana no longer lists them.
    deleteContactPoints:
      - orgId: 1
        uid: slack-platform-critical
      - orgId: 1
        uid: slack-platform-warning
      - orgId: 1
        uid: slack-vanguard-critical
      - orgId: 1
        uid: slack-vanguard-warning
      - orgId: 1
        uid: slack-info
      - orgId: 1
        uid: slack-rustlens-critical
      - orgId: 1
        uid: slack-rustlens-warning
