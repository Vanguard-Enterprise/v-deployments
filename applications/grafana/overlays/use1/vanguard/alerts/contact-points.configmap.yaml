apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-contact-points
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  contact-points.yaml: |
    apiVersion: 1
    # Email is the only alert channel. It goes through smtp-relay to the Google
    # Workspace relay, and alerts@ is a Google Group, so who receives alerts is
    # managed in Google Groups.
    contactPoints:
      - orgId: 1
        name: email-alerts
        receivers:
          - uid: email-alerts
            type: email
            settings:
              addresses: alerts@vngenterprise.com
              singleEmail: true
              # Text templates in templates.configmap.yaml.
              subject: '{{ template "email.subject" . }}'
              message: '{{ template "email.message" . }}'
      # The daily brief (route in notification-policies.configmap.yaml).
      - orgId: 1
        name: email-brief
        receivers:
          - uid: email-brief
            type: email
            settings:
              addresses: alerts@vngenterprise.com
              singleEmail: true
              subject: '{{ template "brief.subject" . }}'
              message: '{{ template "brief.message" . }}'
