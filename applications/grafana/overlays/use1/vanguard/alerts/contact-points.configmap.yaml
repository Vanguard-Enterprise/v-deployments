apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-contact-points
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  contact-points.yaml: |
    apiVersion: 1
    contactPoints:
      # One Slack app / bot token ($SLACK_BOT_TOKEN) posts to every channel below.
      # The bot must be invited to each channel. Channel names are not secrets, so
      # they are set inline; only the token comes from Vault via the grafana-alerting secret.

      # ---- platform ----
      - orgId: 1
        name: slack-platform-critical
        receivers:
          - uid: slack-platform-critical
            type: slack
            settings:
              token: $SLACK_BOT_TOKEN
              recipient: "#alerts-platform-critical"
              username: Grafana
              mentionChannel: here
              title: '{{ template "slack.title" . }}'
              text: '{{ template "slack.text" . }}'
              color: '{{ template "slack.color" . }}'

      - orgId: 1
        name: slack-platform-warning
        receivers:
          - uid: slack-platform-warning
            type: slack
            settings:
              token: $SLACK_BOT_TOKEN
              recipient: "#alerts-platform-warning"
              username: Grafana
              title: '{{ template "slack.title" . }}'
              text: '{{ template "slack.text" . }}'
              color: '{{ template "slack.color" . }}'

      # ---- vanguard ----
      - orgId: 1
        name: slack-vanguard-critical
        receivers:
          - uid: slack-vanguard-critical
            type: slack
            settings:
              token: $SLACK_BOT_TOKEN
              recipient: "#alerts-vanguard-critical"
              username: Grafana
              mentionChannel: here
              title: '{{ template "slack.title" . }}'
              text: '{{ template "slack.text" . }}'
              color: '{{ template "slack.color" . }}'

      - orgId: 1
        name: slack-vanguard-warning
        receivers:
          - uid: slack-vanguard-warning
            type: slack
            settings:
              token: $SLACK_BOT_TOKEN
              recipient: "#alerts-vanguard-warning"
              username: Grafana
              title: '{{ template "slack.title" . }}'
              text: '{{ template "slack.text" . }}'
              color: '{{ template "slack.color" . }}'

      # ---- shared low-priority / heartbeat ----
      - orgId: 1
        name: slack-info
        receivers:
          - uid: slack-info
            type: slack
            settings:
              token: $SLACK_BOT_TOKEN
              recipient: "#alerts-info"
              username: Grafana
              title: '{{ template "slack.title" . }}'
              text: '{{ template "slack.text" . }}'
              color: '{{ template "slack.color" . }}'
