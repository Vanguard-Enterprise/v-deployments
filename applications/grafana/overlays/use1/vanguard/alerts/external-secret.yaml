apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alerting
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-alerting
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Single Slack app / bot token used by every Slack contact point. Add this to Vault at
    # monitoring/grafana-alerting -> SLACK_BOT_TOKEN (xoxb-...) before deploying.
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: monitoring/grafana-alerting
        property: SLACK_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
