apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-notification-policies
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        # Every alert goes to email. The routes below only change how often it
        # is sent: warnings (and anything unlabeled) repeat every 12h.
        receiver: email-alerts
        group_by: [alertname, cluster, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Info, including WeeklyHeartbeat (always firing): one mail a week.
          # Matched first so info never takes the critical timings.
          - receiver: email-alerts
            object_matchers:
              - [severity, "=", info]
            group_by: [alertname]
            repeat_interval: 168h
            continue: false

          # Critical: sent faster and repeated every 4h while it fires.
          - receiver: email-alerts
            object_matchers:
              - [severity, "=", critical]
            group_wait: 15s
            repeat_interval: 4h
            continue: false
