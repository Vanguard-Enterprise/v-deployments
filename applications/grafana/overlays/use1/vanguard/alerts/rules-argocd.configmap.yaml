apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-argocd
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-argocd.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: argocd
        folder: Alerts
        interval: 1m
        rules:
          - uid: argocd-app-out-of-sync
            title: ArgoCDAppOutOfSync
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'argocd_app_info{sync_status!="Synced"}'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 30m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Argo CD app {{ $labels.name }} does not match git
              description: |-
                For over 30 minutes the cluster has differed from what git says this app should be. A recent change may not have deployed, or something was changed by hand. Nothing is necessarily broken yet.
              action: |-
                Open https://argocd.vngenterprise.com/applications/argocd/{{ $labels.name }} and look at the diff and the last sync result. A failed sync shows its error there.

          - uid: argocd-app-degraded
            title: ArgoCDAppDegraded
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'argocd_app_info{health_status="Degraded"}'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Argo CD app {{ $labels.name }} is unhealthy
              description: |-
                Argo CD has reported part of this app as Degraded for 10 minutes. Usually a pod keeps crashing, a rollout failed, or a volume is missing. The app may be fully or partly down.
              action: |-
                Open https://argocd.vngenterprise.com/applications/argocd/{{ $labels.name }}, find the resource marked Degraded, and read its events and pod logs.

          - uid: argocd-redis-sentinel-high-cpu
            title: ArgoCDRedisSentinelHighCPU
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum by (cluster, namespace, pod) (rate(container_cpu_usage_seconds_total{namespace="argocd",container="sentinel"}[5m])) * on (cluster, namespace, pod) group_left(node) max by (cluster, namespace, pod, node) (kube_pod_info{namespace="argocd"}) > 0.2'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Argo CD Redis Sentinel {{ $labels.pod }} is using too much CPU
              description: |-
                The Sentinel container on {{ $labels.node }} has used more than 0.2 CPU cores for 10 minutes. It has done this before when stuck in a reconnect loop. It wastes CPU on the node, but Argo CD keeps working.
              action: |-
                Restart it: kubectl -n argocd delete pod {{ $labels.pod }}. If it comes back, read the sentinel container logs.
