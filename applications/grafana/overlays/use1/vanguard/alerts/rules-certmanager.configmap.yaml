apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-certmanager
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-certmanager.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: cert-manager
        folder: platform
        interval: 1m
        rules:
          - uid: certmanager-absent
            title: CertManagerAbsent
            condition: A
            isPaused: true
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'absent(up{job="cert-manager"})'
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "cert-manager is down; new certificates cannot be issued or renewed"

          - uid: certmanager-cert-expiring-soon
            title: CertManagerCertExpiringSoon
            condition: A
            isPaused: true
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'avg by (exported_namespace, namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)'
                  refId: A
            noDataState: OK
            for: 1h
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Certificate {{ $labels.name }} in {{ $labels.exported_namespace }} expires in <7d"

          - uid: certmanager-cert-not-ready
            title: CertManagerCertNotReady
            condition: A
            isPaused: true
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'max by (name, exported_namespace, namespace, condition) (certmanager_certificate_ready_status{condition="False"}) == 1'
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Certificate {{ $labels.name }} in {{ $labels.exported_namespace }} is not Ready"
