apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-cnpg
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-cnpg.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: cnpg
        folder: Alerts
        interval: 1m
        rules:
          - uid: cnpg-replication-lag
            title: CNPGReplicationLag
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'cnpg_pg_replication_lag_seconds > 60'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Database {{ $labels.namespace }}/{{ $labels.cluster }}: a replica is over a minute behind
              description: |-
                A standby copy of this Postgres database has been more than 60 seconds behind the primary for 10 minutes. The app keeps working, but a failover right now would lose the most recent changes.
              action: |-
                kubectl -n {{ $labels.namespace }} get pods -l cnpg.io/cluster={{ $labels.cluster }}. Look for a replica that is restarting or a slow disk.

          - uid: cnpg-not-ready-instances
            title: CNPGNoReadyInstances
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'cnpg_collector_pg_replication_in_recovery == 1 unless on(cluster) (cnpg_collector_up == 1)'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Database {{ $labels.namespace }}/{{ $labels.cluster }} has no working instance
              description: |-
                No instance of this Postgres database has been up and serving for 5 minutes. The app that uses it is probably down.
              action: |-
                kubectl -n {{ $labels.namespace }} get pods -l cnpg.io/cluster={{ $labels.cluster }}, then read the logs and events of those pods.

          - uid: cnpg-instance-down
            title: CNPGInstanceDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'cnpg_collector_up == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Database pod {{ $labels.pod }} ({{ $labels.namespace }}) is down
              description: |-
                This Postgres pod has not reported for 2 minutes, which usually means Postgres is down or restarting there. If it was the primary, the database fails over to a replica if it has one. If not, the app using it is down.
              action: |-
                kubectl -n {{ $labels.namespace }} get pod {{ $labels.pod }} and kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }}.

          - uid: cnpg-backup-failed
            title: CNPGBackupFailed
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'cnpg_collector_last_failed_backup_timestamp > cnpg_collector_last_available_backup_timestamp'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Database {{ $labels.namespace }}/{{ $labels.cluster }}: the last backup failed
              description: |-
                The newest backup of this Postgres database failed and none has succeeded since. Nothing is down, but a restore could only go back to the last good backup.
              action: |-
                kubectl -n {{ $labels.namespace }} get backups, then describe the newest failed one. Bucket credentials or a full bucket are the usual causes.
