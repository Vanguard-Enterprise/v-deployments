apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-cupboard
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-cupboard.yaml: |
    apiVersion: 1
    groups:
      # Per-service liveness for all 9 cupboard deployables. Signals are kube-state-metrics,
      # available for every namespace. bot has 1 replica and no Service; the deployment
      # replicas-available signal still applies. Runbooks: docs/runbooks/services.md.
      - orgId: 1
        name: cupboard
        folder: platform
        interval: 1m
        rules:
          - uid: cupboard-gateway-down
            title: CupboardGatewayDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_deployment_status_replicas_available{namespace="cupboard-gateway",deployment="cupboard-gateway"} == 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: cupboard
              service: cupboard-gateway
            annotations:
              summary: "cupboard-gateway has zero ready replicas"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardgatewaydown"

          - uid: cupboard-gateway-crashlooping
            title: CupboardGatewayCrashLooping
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'rate(kube_pod_container_status_restarts_total{namespace="cupboard-gateway"}[15m]) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 15m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-gateway
            annotations:
              summary: "cupboard-gateway pod {{ $labels.pod }} is restarting repeatedly"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardgatewaycrashlooping"

          - uid: cupboard-auth-down
            title: CupboardAuthDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_deployment_status_replicas_available{namespace="cupboard-auth",deployment="cupboard-auth"} == 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: cupboard
              service: cupboard-auth
            annotations:
              summary: "cupboard-auth has zero ready replicas"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardauthdown"

          - uid: cupboard-auth-crashlooping
            title: CupboardAuthCrashLooping
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'rate(kube_pod_container_status_restarts_total{namespace="cupboard-auth"}[15m]) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 15m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-auth
            annotations:
              summary: "cupboard-auth pod {{ $labels.pod }} is restarting repeatedly"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardauthcrashlooping"

          - uid: cupboard-tenant-down
            title: CupboardTenantDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
