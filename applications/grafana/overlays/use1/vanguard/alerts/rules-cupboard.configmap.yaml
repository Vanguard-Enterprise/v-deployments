            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: cupboard
              service: cupboard-fleet
            annotations:
              summary: "cupboard-fleet has zero ready replicas"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardfleetdown"

          - uid: cupboard-fleet-crashlooping
            title: CupboardFleetCrashLooping
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'rate(kube_pod_container_status_restarts_total{namespace="cupboard-fleet"}[15m]) > 0'
