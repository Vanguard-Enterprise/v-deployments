            noDataState: OK
            for: 15m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-fleet
            annotations:
              summary: "cupboard-fleet pod {{ $labels.pod }} is restarting repeatedly"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardfleetcrashlooping"

          - uid: cupboard-collector-down
            title: CupboardCollectorDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
