          - uid: cupboard-fleet-down
            title: CupboardFleetDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_deployment_status_replicas_available{namespace="cupboard-fleet",deployment="cupboard-fleet"} == 0'
                  instant: true
