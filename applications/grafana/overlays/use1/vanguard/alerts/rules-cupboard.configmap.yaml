              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/services.md#cupboardbotcrashlooping"

      # CNPG cluster "cupboard" in namespace cupboard-db (single instance, staging).
      # Runbooks: docs/runbooks/database.md.
      - orgId: 1
        name: cupboard-database
        folder: platform
        interval: 1m
        rules:
          - uid: cupboard-db-down
            title: CupboardDBDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'cnpg_collector_up{namespace="cupboard-db"} == 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 2m
            labels:
              severity: critical
              team: cupboard
              service: cupboard-db
            annotations:
              summary: "CNPG cupboard-db instance {{ $labels.pod }} collector is down; every service loses its primary"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/database.md#cupboarddbdown"

          - uid: cupboard-db-high-connections
            title: CupboardDBHighConnections
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(cnpg_backends_total{namespace="cupboard-db"}) > 80'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-db
            annotations:
              summary: "CNPG cupboard-db backend count >80 (default max_connections 100); connection pressure"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/database.md#cupboarddbhighconnections"

      # opstree RedisReplication "cupboard-redis" (streams bus) in namespace cupboard-redis.
      # No redisExporter sidecar, so health rides kube-state-metrics on the StatefulSet.
      # Runbooks: docs/runbooks/redis.md.
      - orgId: 1
        name: cupboard-redis
        folder: platform
        interval: 1m
        rules:
          - uid: cupboard-redis-down
            title: CupboardRedisDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_statefulset_status_replicas_ready{namespace="cupboard-redis",statefulset="cupboard-redis"} == 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: cupboard
              service: cupboard-redis
            annotations:
              summary: "cupboard-redis has zero ready replicas; the ticket-stream bus is down"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/redis.md#cupboardredisdown"

          - uid: cupboard-redis-crashlooping
            title: CupboardRedisCrashLooping
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'rate(kube_pod_container_status_restarts_total{namespace="cupboard-redis"}[15m]) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 15m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-redis
            annotations:
              summary: "cupboard-redis pod {{ $labels.pod }} is restarting repeatedly"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/redis.md#cupboardrediscrashlooping"

      # Custom-domain TLS for storefronts. cert-manager Certificates live in cupboard-web;
      # the metric carries the resource namespace as exported_namespace.
      # Runbooks: docs/runbooks/certificates.md.
      - orgId: 1
        name: cupboard-certificates
        folder: platform
        interval: 1m
        rules:
          - uid: cupboard-cert-not-ready
            title: CupboardCertNotReady
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'max by (name, exported_namespace) (certmanager_certificate_ready_status{exported_namespace="cupboard-web",condition="False"}) == 1'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 15m
            labels:
              severity: critical
              team: cupboard
              service: cupboard-web
            annotations:
              summary: "Custom-domain cert {{ $labels.name }} (cupboard-web) is not Ready; issuance or renewal is failing"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/certificates.md#cupboardcertnotready"

          - uid: cupboard-cert-expiring-soon
            title: CupboardCertExpiringSoon
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'avg by (exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{exported_namespace="cupboard-web"} - time()) < (7 * 24 * 3600)'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 1h
            labels:
              severity: warning
              team: cupboard
              service: cupboard-web
            annotations:
              summary: "Custom-domain cert {{ $labels.name }} (cupboard-web) expires in <7d and has not renewed"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/certificates.md#cupboardcertexpiringsoon"

      # App-level HTTP signals from OTLP http_server_request_count (labels: job=cupboard-<svc>,
      # http_route, http_response_status_code). OTLP metric-name suffixes are OFF on this
      # Mimir, so counters keep their emitted names (no _total).
      # Runbooks: docs/runbooks/api-and-limiter.md.
      - orgId: 1
        name: cupboard-api
        folder: platform
        interval: 1m
        rules:
          - uid: cupboard-gateway-5xx-rate
            title: CupboardGateway5xxRate
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(rate(http_server_request_count{job="cupboard-gateway",http_response_status_code=~"5..",http_route!~"/healthz|/readyz"}[5m])) / clamp_min(sum(rate(http_server_request_count{job="cupboard-gateway",http_route!~"/healthz|/readyz"}[5m])), 1) > 0.05'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-gateway
            annotations:
              summary: "cupboard-gateway 5xx rate >5% over 5m across API routes"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/api-and-limiter.md#cupboardgateway5xxrate"

          - uid: cupboard-ratelimiter-fail-open
            title: CupboardRateLimiterFailOpen
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(increase(gateway_ratelimit_fail_open{job="cupboard-gateway"}[10m])) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-gateway
            annotations:
              summary: "cupboard-gateway rate limiter is failing open (Redis unreachable); requests bypass rate limits"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/api-and-limiter.md#cupboardratelimiterfailopen"

      # Billing / Stripe webhook ingestion on the tenant service. The webhook route is
      # exact: /webhooks/stripe. Stripe retries failures, so a sustained burst matters.
      # Runbooks: docs/runbooks/billing.md.
      - orgId: 1
        name: cupboard-billing
        folder: platform
        interval: 1m
        rules:
          - uid: cupboard-stripe-webhook-5xx
            title: CupboardStripeWebhook5xx
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(increase(http_server_request_count{job="cupboard-tenant",http_route="/webhooks/stripe",http_response_status_code=~"5.."}[15m])) > 3'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: cupboard
              service: cupboard-tenant
            annotations:
              summary: "cupboard-tenant returned >3 5xx on /webhooks/stripe in 15m; entitlements may be missing"
              runbook_url: "https://github.com/Vanguard-Enterprise/Cupboard/blob/main/docs/runbooks/billing.md#cupboardstripewebhook5xx"
