apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-heartbeat
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-heartbeat.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: heartbeat
        folder: Alerts
        interval: 1m
        rules:
          - uid: heartbeat-weekly
            title: WeeklyHeartbeat
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 60, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'vector(1)'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 0s
            labels:
              severity: info
              team: platform
            annotations:
              summary: |-
                Weekly check-in: alert emails are working
              description: |-
                This alert fires on purpose, all the time. It is emailed once a week so you know Grafana, the email relay and Google are all delivering alerts.
              action: |-
                Nothing. If a week passes without this email, alerting is broken: check Grafana and the smtp-relay app.
