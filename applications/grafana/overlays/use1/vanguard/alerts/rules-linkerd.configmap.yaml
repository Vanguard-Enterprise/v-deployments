apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-linkerd
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-linkerd.yaml: |
    apiVersion: 1
    groups:
      # Phase 7 PR7. The Linkerd mesh carries all cupboard service-to-service
      # traffic, and its identity issuer is a MANUALLY rotated certificate: the
      # trust anchor's private key is deliberately kept in OpenBao and never
      # given to the cluster, so nothing can renew the issuer automatically.
      # When the issuer expires, proxies stop being able to obtain workload
      # certificates and ALL meshed traffic fails. These alerts are the only
      # automated guard against that.
      # Runbook: cluster/talos/use1/linkerd-cert-rotation.md
      #
      # Metric name verified against the live identity controller on :9990;
      # it is issuer_cert_ttl_seconds, NOT the
      # identity_cert_expiration_timestamp_seconds that the docs elsewhere imply.
      - orgId: 1
        name: linkerd
        folder: Alerts
        interval: 1m
        rules:
          # 30 days: enough runway to schedule the rotation calmly.
          - uid: linkerd-issuer-cert-expiring
            title: LinkerdIssuerCertExpiring
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'issuer_cert_ttl_seconds < 2592000'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 15m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Linkerd mesh certificate expires in {{ humanizeDuration $values.A.Value }}
              description: |-
                The Linkerd identity issuer certificate is renewed by hand on purpose (its signing key is kept only in OpenBao). When it expires, meshed services (cupboard) can no longer talk to each other.
              action: |-
                Schedule the rotation in the next few weeks using the runbook below.
              runbook_url: "https://github.com/Vanguard-Enterprise/v-deployments/blob/main/cluster/talos/use1/linkerd-cert-rotation.md"

          # 7 days: at this point the mesh is close to a full outage.
          - uid: linkerd-issuer-cert-expiring-critical
            title: LinkerdIssuerCertExpiringCritical
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'issuer_cert_ttl_seconds < 604800'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 15m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Linkerd mesh certificate expires in {{ humanizeDuration $values.A.Value }}: rotate it now
              description: |-
                When it expires, ALL meshed traffic fails and the cupboard services stop working.
              action: |-
                Rotate it now using the runbook below.
              runbook_url: "https://github.com/Vanguard-Enterprise/v-deployments/blob/main/cluster/talos/use1/linkerd-cert-rotation.md"

          # The identity controller itself. If this is down, no workload can get
          # or renew a certificate, and existing certs age out within 24h.
          - uid: linkerd-identity-down
            title: LinkerdIdentityDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_deployment_status_replicas_available{namespace="linkerd",deployment="linkerd-identity"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Linkerd identity service is down
              description: |-
                linkerd-identity has had no ready pods for 5 minutes. Meshed pods cannot get or renew their certificates: new pods cannot start talking, and running ones fail within about a day as their certificates expire.
              action: |-
                kubectl -n linkerd get pods and kubectl -n linkerd logs deploy/linkerd-identity -c identity. An expired issuer certificate is a common cause (runbook below).
              runbook_url: "https://github.com/Vanguard-Enterprise/v-deployments/blob/main/cluster/talos/use1/linkerd-cert-rotation.md"
