apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-longhorn
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-longhorn.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: longhorn
        folder: General
        interval: 1m
        rules:
          - uid: longhorn-volume-degraded
            title: LonghornVolumeDegraded
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'longhorn_volume_robustness == 2'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} is degraded"

          - uid: longhorn-volume-faulted
            title: LonghornVolumeFaulted
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'longhorn_volume_robustness == 3'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} FAULTED"

          - uid: longhorn-node-down
            title: LonghornNodeDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: '(avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "One or more Longhorn nodes are offline"

          - uid: longhorn-backup-failed
            title: LonghornBackupFailed
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'count(longhorn_backup_state == 4) > 3'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "More than 3 Longhorn backups are in Error state — check the backup target and recurring jobs"
