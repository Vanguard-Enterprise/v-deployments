apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-longhorn
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-longhorn.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: longhorn
        folder: Alerts
        interval: 1m
        rules:
          - uid: longhorn-volume-degraded
            title: LonghornVolumeDegraded
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'longhorn_volume_robustness == 2'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Storage volume {{ $labels.volume }} has lost a copy
              description: |-
                Longhorn keeps several copies of each volume on different nodes. This one is missing at least one, usually because a node is down or a copy is rebuilding. The data is still available, but if the remaining copies are lost the volume fails.
              action: |-
                It usually fixes itself once the node is back and the rebuild finishes. If it lasts more than an hour, check the volume in the Longhorn UI.

          - uid: longhorn-volume-faulted
            title: LonghornVolumeFaulted
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'longhorn_volume_robustness == 3'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Storage volume {{ $labels.volume }} has FAILED
              description: |-
                Longhorn has no healthy copy of this volume. The app using it cannot read or write its data and is down.
              action: |-
                Check the volume in the Longhorn UI. Do not edit replica files by hand. If it reports no replicas to salvage, a node disk is too full: free space first. Otherwise restore it from the latest backup.

          - uid: longhorn-node-down
            title: LonghornNodeDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: '(avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                {{ printf "%.0f" $values.A.Value }} Longhorn storage node(s) offline
              description: |-
                Volumes with copies on the missing node are running with fewer copies, and nothing new can be placed on it.
              action: |-
                kubectl get nodes and kubectl -n longhorn-system get nodes.longhorn.io to see which node and why.

          - uid: longhorn-backup-failed
            title: LonghornBackupFailed
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'count(longhorn_backup_state == 4) > 3'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Longhorn backups are failing
              description: |-
                {{ printf "%.0f" $values.A.Value }} volume backups are in the Error state, so volumes are not being backed up off the cluster. A lost volume could not be fully restored.
              action: |-
                In the Longhorn UI under Backup, check the backup target (bucket and credentials) and the recurring backup jobs.
