apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-metallb
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-metallb.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: metallb
        folder: Alerts
        interval: 1m
        rules:
          - uid: metallb-config-not-loaded
            title: MetalLBConfigNotLoaded
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'metallb_k8s_client_config_loaded_bool == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 1m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                MetalLB has no valid configuration
              description: |-
                MetalLB gives services their LAN addresses (10.1.50.x, for example Traefik and the email relay). {{ $labels.pod }} cannot load its config, so those addresses may stop being announced and the services become unreachable from the LAN.
              action: |-
                kubectl -n metallb-system logs {{ $labels.pod }} shows the config error. Check recent git changes to the IPAddressPool and L2Advertisement.

          - uid: metallb-pool-exhausted
            title: MetalLBAddressPoolExhausted
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'metallb_allocator_addresses_in_use_total / metallb_allocator_addresses_total >= 1'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 1m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                MetalLB address pool {{ $labels.pool }} is full
              description: |-
                Every LAN address in this pool is in use. A new LoadBalancer service will not get an address and stays Pending.
              action: |-
                Remove an unused LoadBalancer service, or add addresses to the pool in git.

          - uid: metallb-pool-high
            title: MetalLBAddressPoolHigh
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'metallb_allocator_addresses_in_use_total / metallb_allocator_addresses_total >= 0.9'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                MetalLB address pool {{ $labels.pool }} is {{ humanizePercentage $values.A.Value }} used
              description: |-
                The pool of LAN addresses for services is nearly full. Once it is full, new LoadBalancer services cannot get an address.
              action: |-
                Plan to free an unused address or add addresses to the pool in git.
