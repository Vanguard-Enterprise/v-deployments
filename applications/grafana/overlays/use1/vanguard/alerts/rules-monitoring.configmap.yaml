apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-monitoring
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-monitoring.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: monitoring
        folder: Alerts
        interval: 1m
        rules:
          - uid: monitoring-mimir-down
            title: MimirDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'up{namespace="mimir"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Mimir appears down"

          - uid: monitoring-loki-down
            title: LokiDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'up{namespace="loki"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Loki appears down"

          - uid: monitoring-alloy-dropped-samples
            title: AlloyDroppedSamples
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'rate(alloy_prometheus_remote_write_samples_failed_total[10m]) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Alloy is dropping samples on remote_write"

          # Mimir watching itself is blind: on 2026-11-07 its disk filled, it
          # stopped storing samples, every rule above went NoData -> OK, and
          # PVCUsageHigh auto-resolved at the moment things broke. These two
          # rules fail loud instead.
          - uid: monitoring-mimir-no-fresh-data
            title: MimirNoFreshData
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  # node_load1 comes from every node; if none arrived in the
                  # last 10m, Mimir is not ingesting.
                  expr: 'absent_over_time(node_load1[10m])'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Mimir has stored no new samples for 10m (or cannot be queried). Metrics-based alerts are blind."

          - uid: monitoring-mimir-errors-in-logs
            title: MimirErrorsInLogs
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: loki
                model:
                  # Evaluated from Loki so it still works when Mimir is broken.
                  expr: 'sum(count_over_time({namespace="mimir"} |~ "no space left on device|unable to open TSDB|module failed|corruption in segment|WAL truncation" [10m])) > 0'
                  queryType: instant
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Mimir is logging storage errors (disk full, WAL corruption, or TSDB failing to open)"
