apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-monitoring
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-monitoring.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: monitoring
        folder: Alerts
        interval: 1m
        rules:
          - uid: monitoring-mimir-down
            title: MimirDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'up{namespace="mimir"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Mimir (metrics storage) is down
              description: |-
                Mimir pod {{ $labels.pod }} has failed its health check for 5 minutes. Most alerts depend on Mimir, so while it is down they cannot fire, and dashboards show gaps.
              action: |-
                kubectl -n mimir get pods and read the failing pod's logs. A full disk or a corrupted WAL has caused this before.

          - uid: monitoring-loki-down
            title: LokiDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'up{namespace="loki"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Loki (log storage) is down
              description: |-
                Loki pod {{ $labels.pod }} has failed its health check for 5 minutes. Logs are not being stored or searchable, and log-based alerts (such as the Mimir storage errors alert) cannot fire.
              action: |-
                kubectl -n loki get pods and read the failing pod's logs.

          - uid: monitoring-alloy-dropped-samples
            title: AlloyDroppedSamples
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'rate(alloy_prometheus_remote_write_samples_failed_total[10m]) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Metrics are being dropped before they reach Mimir
              description: |-
                Alloy, the metrics collector, has failed to send some metrics to Mimir for 10 minutes. Dashboards have gaps and some alerts may miss problems.
              action: |-
                Check the alloy-metrics and Mimir logs. Mimir being down or rejecting data (too many series) is the usual cause.

          # Mimir watching itself is blind: on 2026-11-07 its disk filled, it
          # stopped storing samples, every rule above went NoData -> OK, and
          # PVCUsageHigh auto-resolved at the moment things broke. These two
          # rules fail loud instead.
          - uid: monitoring-mimir-no-fresh-data
            title: MimirNoFreshData
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  # node_load1 comes from every node; if none arrived in the
                  # last 10m, Mimir is not ingesting.
                  expr: 'absent_over_time(node_load1[10m])'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                No new metrics for 10 minutes: most alerts are blind
              description: |-
                Mimir has stored no new node metrics for 10 minutes, or cannot be queried. Almost every other alert depends on these metrics, so problems elsewhere would go unnoticed right now.
              action: |-
                kubectl -n mimir get pods and kubectl -n alloy-metrics get pods. Fix whichever is not running.

          - uid: monitoring-mimir-errors-in-logs
            title: MimirErrorsInLogs
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: loki
                model:
                  # Evaluated from Loki so it still works when Mimir is broken.
                  expr: 'sum(count_over_time({namespace="mimir"} |~ "no space left on device|unable to open TSDB|module failed|corruption in segment|WAL truncation" [10m])) > 0'
                  queryType: instant
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Mimir is reporting storage errors
              description: |-
                Mimir's logs show disk-full, WAL corruption or database-open errors. In November 2026 this lost several days of metrics. New metrics may not be stored.
              action: |-
                Find the error in Grafana Explore (Loki): {namespace="mimir"} |~ "no space left|corruption|WAL|TSDB". Check the Mimir volume's free space.
