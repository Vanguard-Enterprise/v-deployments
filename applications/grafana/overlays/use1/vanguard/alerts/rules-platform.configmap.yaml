apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-platform
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-platform.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: platform
        folder: Alerts
        interval: 1m
        rules:
          - uid: platform-node-not-ready
            title: NodeNotReady
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_node_status_condition{condition="Ready",status="true"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Kubernetes node {{ $labels.node }} is down
              description: |-
                The node has not been Ready for 5 minutes. Pods on it are not running or not reachable. They move to other nodes after a few minutes if there is room.
              action: |-
                Check the VM in Proxmox, then talosctl -n <node IP> dmesg. Proxmox host problems (pve1a, pve1b) have caused this before.

          - uid: platform-node-mem-pressure
            title: NodeMemoryPressure
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_node_status_condition{condition="MemoryPressure",status="true"} == 1'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Node {{ $labels.node }} is running out of memory
              description: |-
                Kubernetes reports memory pressure on this node, so it starts evicting pods to free memory, which restarts apps.
              action: |-
                kubectl describe node {{ $labels.node }} and check the node's memory in Grafana to find the largest pods.

          - uid: platform-node-disk-pressure
            title: NodeDiskPressure
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'kube_node_status_condition{condition="DiskPressure",status="true"} == 1'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Node {{ $labels.node }} is running out of disk
              description: |-
                Kubernetes reports disk pressure on this node, so it removes unused images and evicts pods, which restarts apps.
              action: |-
                kubectl describe node {{ $labels.node }} and check the node's disk in Grafana.

          - uid: platform-fs-usage-high
            title: FilesystemUsageHigh
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: '(node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ humanizePercentage $values.A.Value }} full
              description: |-
                Over 85% used. If it fills up, writes fail there (logs, container images, volumes) and Kubernetes starts evicting pods.
              action: |-
                Clean up data that is not needed, or grow the disk.

          - uid: platform-kubelet-down
            title: KubeletDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'up{job="kubelet"} == bool 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Node {{ $labels.node }} is not responding
              description: |-
                The kubelet (the agent that runs pods on the node) has not answered for 5 minutes. The node is probably down or overloaded.
              action: |-
                Check the VM in Proxmox, then talosctl -n <node IP> dmesg. Proxmox host problems (pve1a, pve1b) have caused this before.

          # CPU steal on a node VM means the Proxmox host is starving the guest of CPU
          # (host oversubscription / noisy neighbour). This is the guest-side proof metric
          # behind the 2026-07-04 etcd incident, so alert before it degrades the control plane.
          - uid: platform-node-cpu-steal
            title: NodeCPUSteal
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'avg by (instance) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.05'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Node VM {{ $labels.instance }} is being starved of CPU by Proxmox
              description: |-
                It is losing {{ humanizePercentage $values.A.Value }} of its CPU time to other VMs on the same Proxmox host. In July 2026 this made etcd unstable, which can take the whole cluster down.
              action: |-
                Check that Proxmox host's CPU use. Move or limit busy VMs on it.
