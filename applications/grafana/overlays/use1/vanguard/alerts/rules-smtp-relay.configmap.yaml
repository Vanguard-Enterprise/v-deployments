apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-smtp-relay
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  # The smtp-relay app (applications/smtp-relay). Alerts are sent by email through
  # this same relay: queue and auth alerts still arrive (the queue delivers once
  # fixed), but SmtpRelayDown cannot be mailed while no replica runs, so it only
  # shows in Grafana under Alerting > Alert rules.
  rules-smtp-relay.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: smtp-relay
        folder: Alerts
        interval: 1m
        rules:
          - uid: smtp-relay-no-ready-replica
            title: SmtpRelayDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  # `bool` so the result is 1 (down) or 0 (up). A plain `< 1` keeps the
                  # sample at value 0, which Grafana evaluates as Normal.
                  expr: 'kube_statefulset_status_replicas_ready{namespace="smtp-relay", statefulset="smtp-relay"} < bool 1'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                The email relay is down
              description: |-
                No smtp-relay pod is ready, so Grafana, Pocket ID and other apps cannot send email. You will usually only see this in Grafana, because this email needs the relay too.
              action: |-
                kubectl -n smtp-relay get pods and kubectl -n smtp-relay logs smtp-relay-0 -c mail.

          - uid: smtp-relay-deferred-queue
            title: SmtpRelayDeferredQueue
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(postfix_showq_queue_depth{namespace="smtp-relay", queue="deferred"}) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 20m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                {{ printf "%.0f" $values.A.Value }} email(s) waiting to be sent
              description: |-
                The relay has held mail for over 20 minutes because Google will not take it. Usually our public IP changed and Google's relay settings still have the old one. Mail is kept for 5 days and retried every 15 minutes, so nothing is lost yet.
              action: |-
                Update the IP at https://admin.google.com/ac/apps/gmail/routing (SMTP relay service). The reason for each message: kubectl -n smtp-relay exec smtp-relay-0 -c mail -- mailq

          - uid: smtp-relay-deferred-queue-stuck
            title: SmtpRelayDeferredQueueStuck
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(postfix_showq_queue_depth{namespace="smtp-relay", queue="deferred"}) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 6h
            labels:
              severity: critical
              team: platform
            annotations:
              summary: |-
                Email has been stuck for over 6 hours
              description: |-
                The relay has held mail for 6 hours. It is sent back as undeliverable after 5 days.
              action: |-
                Fix the cause (see the waiting-email alert: usually the IP in Google's relay settings), then send the queue now: kubectl -n smtp-relay exec smtp-relay-0 -c mail -- postqueue -f (and again for smtp-relay-1).

          - uid: smtp-relay-auth-failures
            title: SmtpRelayAuthFailures
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  # One bad login can count up to 3 (clients try several SASL mechanisms).
                  expr: 'sum(increase(postfix_smtpd_sasl_authentication_failures_total{namespace="smtp-relay"}[15m])) > 10'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 0m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Repeated failed logins to the email relay
              description: |-
                More than 10 failed logins in 15 minutes. Usually an app has the wrong relay password (for example after a rotation). It can also be something on the network guessing passwords.
              action: |-
                Find the login in Grafana Explore (Loki): {namespace="smtp-relay"} |= "authentication failed"

          - uid: smtp-relay-rejected
            title: SmtpRelayRejectedMessages
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(increase(postfix_smtpd_messages_rejected_total{namespace="smtp-relay"}[15m])) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 0m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                The email relay refused a message
              description: |-
                An app tried to send mail the relay will not accept, usually a From address that does not match its login (each app may only send as its own address) or a bad recipient. That email was not sent.
              action: |-
                Find it in Grafana Explore (Loki): {namespace="smtp-relay"} |= "reject:"
