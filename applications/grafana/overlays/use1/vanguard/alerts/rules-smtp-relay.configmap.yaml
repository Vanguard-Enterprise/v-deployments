apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-smtp-relay
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  # The smtp-relay app (applications/smtp-relay). These route to Slack, never to
  # email, so they still arrive when the mail path is what is broken.
  rules-smtp-relay.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: smtp-relay
        folder: Alerts
        interval: 1m
        rules:
          - uid: smtp-relay-no-ready-replica
            title: SmtpRelayDown
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  # `bool` so the result is 1 (down) or 0 (up). A plain `< 1` keeps the
                  # sample at value 0, which Grafana evaluates as Normal.
                  expr: 'kube_statefulset_status_replicas_ready{namespace="smtp-relay", statefulset="smtp-relay"} < bool 1'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "No smtp-relay replica is ready: apps cannot send email"
              description: "kubectl -n smtp-relay get pods; kubectl -n smtp-relay logs smtp-relay-0 -c mail"

          - uid: smtp-relay-deferred-queue
            title: SmtpRelayDeferredQueue
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(postfix_showq_queue_depth{namespace="smtp-relay", queue="deferred"}) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 20m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "{{ $values.A.Value }} email(s) waiting in the smtp-relay queue for 20m+"
              description: "Most often Google refusing our public IP: update it at https://admin.google.com/ac/apps/gmail/routing (SMTP relay service). Reason per message: kubectl -n smtp-relay exec smtp-relay-0 -c mail -- mailq. Mail is kept 5 days and retried every 15 minutes."

          - uid: smtp-relay-deferred-queue-stuck
            title: SmtpRelayDeferredQueueStuck
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(postfix_showq_queue_depth{namespace="smtp-relay", queue="deferred"}) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 6h
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "smtp-relay has held email for 6h+; it bounces after 5 days"
              description: "See SmtpRelayDeferredQueue. After fixing the cause, flush with: kubectl -n smtp-relay exec smtp-relay-0 -c mail -- postqueue -f (repeat for smtp-relay-1)."

          - uid: smtp-relay-auth-failures
            title: SmtpRelayAuthFailures
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  # One bad login can count up to 3 (clients try several SASL mechanisms).
                  expr: 'sum(increase(postfix_smtpd_sasl_authentication_failures_total{namespace="smtp-relay"}[15m])) > 10'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 0m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Repeated failed logins on smtp-relay (wrong app password or probing)"
              description: 'Loki: {namespace="smtp-relay"} |= "authentication failed"'

          - uid: smtp-relay-rejected
            title: SmtpRelayRejectedMessages
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(increase(postfix_smtpd_messages_rejected_total{namespace="smtp-relay"}[15m])) > 0'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 0m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "smtp-relay refused a message (sender not owned by the login, or bad recipient)"
              description: 'Loki: {namespace="smtp-relay"} |= "reject:"'
