apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rules-traefik
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  rules-traefik.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: traefik
        folder: Alerts
        interval: 1m
        rules:
          - uid: traefik-5xx-rate
            title: Traefik5xxRate
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.01'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                {{ humanizePercentage $values.A.Value }} of web requests are failing
              description: |-
                Traefik, the web entry point, has returned server errors (5xx) on more than 1% of all requests for 5 minutes. A site or app behind it is broken or down.
              action: |-
                Find the service in Grafana Explore: sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m])), then check that app's pods.

          - uid: traefik-cert-expiry
            title: TraefikCertExpiry
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 86400, to: 0 }
                datasourceUid: mimir
                model:
                  expr: '(traefik_tls_certs_not_after - time()) / 86400 < 7'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 1h
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                Certificate for {{ $labels.sans }} expires in {{ printf "%.0f" $values.A.Value }} day(s)
              description: |-
                Traefik is serving a certificate that expires within 7 days, so renewal is not working. When it expires, browsers show a security error for that site.
              action: |-
                kubectl get certificate -A to find the matching cert-manager Certificate, then describe it.

          - uid: traefik-4xx-rate
            title: TraefikHigh4xxRate
            condition: A
            isPaused: false
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  expr: 'sum(rate(traefik_service_requests_total{code=~"4.."}[5m])) by (service) / sum(rate(traefik_service_requests_total[5m])) by (service) * 100 > 5'
                  instant: true
                  range: false
                  refId: A
            noDataState: OK
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: |-
                {{ printf "%.0f" $values.A.Value }}% of requests to {{ $labels.service }} are rejected
              description: |-
                Over 5% of requests to this service got a 4xx response (not found, unauthorized, forbidden) for 5 minutes. Often harmless (bots, scanners, expired logins), but after a change it can mean a broken link or login setup.
              action: |-
                Look at the service's access logs in Grafana Explore (Loki) to see which paths and clients get the errors.
