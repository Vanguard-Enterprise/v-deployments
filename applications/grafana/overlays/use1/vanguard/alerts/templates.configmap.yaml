apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-templates
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  templates.yaml: |
    apiVersion: 1
    # Email uses Grafana's built-in template. These removed the Slack message
    # templates provisioned earlier; delete this file once Grafana no longer
    # lists them under Alerting > Contact points > Notification templates.
    deleteTemplates:
      - orgId: 1
        name: slack.title
      - orgId: 1
        name: slack.color
      - orgId: 1
        name: slack.alert
      - orgId: 1
        name: slack.text
