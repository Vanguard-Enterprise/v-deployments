apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-templates
  namespace: grafana
  labels:
    grafana_alert: "1"
data:
  templates.yaml: |
    apiVersion: 1
    # Alert email text, used by the email-alerts contact point (subject and
    # message). Kept short: what is wrong, since when, where, and a link. The
    # longer description and action annotations show in Grafana only. With a message set, Grafana's email keeps its header and footer
    # and shows these lines instead of its own alert table. The email layout
    # escapes HTML and turns each line into a line break, so this is plain text.
    templates:
      - orgId: 1
        name: email
        template: |
          {{ define "email.icon" -}}
          {{ if eq .Status "resolved" }}✅{{ else if eq .Labels.severity "critical" }}🔴{{ else if eq .Labels.severity "warning" }}🟠{{ else }}🔵{{ end }}
          {{- end }}

          {{ define "email.severity" -}}
          {{ if eq .Labels.severity "critical" }}Critical{{ else if eq .Labels.severity "warning" }}Warning{{ else if eq .Labels.severity "info" }}Info{{ else }}Alert{{ end }}
          {{- end }}

          {{ define "email.what" -}}
          {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
          {{- end }}

          {{ define "email.subject" -}}
          {{ $a := index .Alerts 0 -}}
          {{ if .Alerts.Firing }}{{ $a = index .Alerts.Firing 0 }}{{ end -}}
          {{ if not .Alerts.Firing }}✅ Resolved{{ else }}{{ template "email.icon" $a }} {{ template "email.severity" $a }}{{ end }}:
          {{- if eq (len .Alerts) 1 }} {{ template "email.what" $a }}
          {{- else }} {{ .CommonLabels.alertname }} ({{ if .Alerts.Firing }}{{ len .Alerts.Firing }} firing{{ end }}{{ if and .Alerts.Firing .Alerts.Resolved }}, {{ end }}{{ if .Alerts.Resolved }}{{ len .Alerts.Resolved }} resolved{{ end }}){{ end }}
          {{- end }}

          {{ define "email.when" }}{{ . | tz "America/New_York" | date "Mon Jan 2, 3:04 PM MST" }}{{ end }}

          {{ define "email.alert" -}}
          {{ template "email.icon" . }} {{ if eq .Status "resolved" }}Resolved: {{ end }}{{ template "email.what" . }}
          {{ if eq .Status "resolved" }}{{ template "email.when" .StartsAt }} to {{ template "email.when" .EndsAt }}{{ else }}Since {{ template "email.when" .StartsAt }}{{ end }}
          {{ .Labels.alertname }}
          {{- range .Labels.SortedPairs }}{{ if match "^(namespace|exported_namespace|pod|container|node|deployment|daemonset|statefulset|persistentvolumeclaim|volume|pool|mountpoint|sans)$" .Name }}, {{ .Name }} {{ .Value }}{{ end }}{{ end }}
          {{- if .GeneratorURL }}
          {{ .GeneratorURL }}{{ end }}
          {{- end }}

          {{ define "email.message" -}}
          {{ range $i, $a := .Alerts.Firing }}{{ if $i }}

          {{ end }}{{ template "email.alert" $a }}{{ end }}
          {{- if and .Alerts.Firing .Alerts.Resolved }}

          {{ end }}
          {{- range $i, $a := .Alerts.Resolved }}{{ if $i }}

          {{ end }}{{ template "email.alert" $a }}{{ end }}
          {{- end }}

          {{/* Daily brief. $open and $watch get one "x" per alert, so len counts them. */}}
          {{ define "brief.subject" -}}
          {{ $open := "" }}{{ $watch := "" -}}
          {{ range .Alerts.Firing }}{{ if eq .Labels.brief "watch" }}{{ $watch = printf "%sx" $watch }}{{ else if ne .Labels.severity "info" }}{{ $open = printf "%sx" $open }}{{ end }}{{ end -}}
          Daily brief: {{ if and (not $open) (not $watch) }}all clear{{ else }}
          {{- if $open }}{{ len $open }} open {{ if eq (len $open) 1 }}alert{{ else }}alerts{{ end }}{{ end }}
          {{- if and $open $watch }}, {{ end }}
          {{- if $watch }}{{ len $watch }} to look at{{ end }}{{ end }}
          {{- end }}

          {{ define "brief.message" -}}
          {{ $open := "" }}{{ $watch := "" -}}
          {{ range .Alerts.Firing }}{{ if eq .Labels.brief "watch" }}{{ $watch = printf "%sx" $watch }}{{ else if ne .Labels.severity "info" }}{{ $open = printf "%sx" $open }}{{ end }}{{ end -}}
          {{ if $open }}Open alerts
          {{ range .Alerts.Firing }}{{ if and (ne .Labels.severity "info") (ne .Labels.brief "watch") }}{{ template "email.icon" . }} {{ template "email.what" . }}, since {{ template "email.when" .StartsAt }}
          {{ end }}{{ end }}
          {{ end }}
          {{- if $watch }}Worth a look
          {{ range .Alerts.Firing }}{{ if eq .Labels.brief "watch" }}• {{ template "email.what" . }}
          {{ end }}{{ end }}
          {{ end }}
          {{- if and (not $open) (not $watch) }}Nothing open, and nothing above its usual levels in the last day.

          {{ end -}}
          All alerts: https://grafana.vngenterprise.com/alerting/list
          {{- end }}


    # Templates provisioned earlier for Slack and, before that, Discord. A
    # template dropped from the list above stays in Grafana, so these remove them.
    # Safe to delete this block once Grafana no longer lists them.
    deleteTemplates:
      - orgId: 1
        name: slack.title
      - orgId: 1
        name: slack.color
      - orgId: 1
        name: slack.alert
      - orgId: 1
        name: slack.text
      - orgId: 1
        name: discord.title
      - orgId: 1
        name: discord.alert
      - orgId: 1
        name: discord.message
