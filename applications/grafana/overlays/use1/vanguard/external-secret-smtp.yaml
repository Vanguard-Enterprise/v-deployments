# Grafana's login on the smtp-relay. Only Grafana's own property is read.
# Wave -1: Argo CD waits for this to be Ready before rolling Grafana, so the pod
# starts with GF_SMTP_PASSWORD set. Env vars are only read at start, so a password
# change needs a refresh of this secret and then a Grafana restart, in that order
# (see "Rotating a password" on the wiki page https://github.com/Vanguard-Enterprise/v-deployments/wiki/SMTP-Relay).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-smtp
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: smtp-relay/use1
        property: grafana
