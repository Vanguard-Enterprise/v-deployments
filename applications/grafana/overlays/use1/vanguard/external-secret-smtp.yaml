# Grafana's login on the smtp-relay. Only Grafana's own property is read.
# Wave -1: Argo CD waits for this to be Ready before rolling Grafana, so the pod
# starts with GF_SMTP_PASSWORD set. Env vars are read at start, so after changing
# the password: kubectl -n grafana rollout restart deployment grafana
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-smtp
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: smtp-relay/use1
        property: grafana
