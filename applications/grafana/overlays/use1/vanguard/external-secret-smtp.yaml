# Grafana's login on the smtp-relay. Only Grafana's own property is read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-smtp
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: smtp-relay/use1
        property: grafana
