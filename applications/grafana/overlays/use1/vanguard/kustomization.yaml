apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - grafana.vngenterprise.com.yaml
  - monitoring.yaml
  - external-secret-admin.yaml
  - external-secret-smtp.yaml
  - ./alerts
  - ./dashboards
helmCharts:
  # The chart moved to grafana-community; the old grafana repo stopped at 10.5.15.
  - name: grafana
    version: "14.4.0"
    repo: https://grafana-community.github.io/helm-charts
    releaseName: grafana
    namespace: grafana
    valuesFile: values.yaml
