apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-oncall-plugin-provisioning
  namespace: grafana
data:
  grafana-oncall-app-provisioning.yaml: |
    apps:
      - type: grafana-oncall-app
        name: grafana-oncall-app
        disabled: false
        jsonData:
          stackId: 5
          orgId: 100
          onCallApiUrl: https://oncall.vngenterprise.com
