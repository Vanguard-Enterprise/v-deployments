testFramework:
  enabled: false
persistence:
  enabled: false
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
grafana.ini:
  auth:
    managed_service_accounts_enabled: true
  feature_toggles:
    enable: externalServiceAccounts
  database:
    type: postgres
    host: grafana-db-rw.grafana.svc.cluster.local:5432
    name: grafana
    user: grafana
    ssl_mode: require
  grafana_net:
    url: https://grafana.vngenterprise.com
  server:
    root_url: https://grafana.vngenterprise.com
  auth.generic_oauth:
    enabled: true
    name: "VANGUARD SSO"
    allow_sign_up: true
    client_id: "bc7403cd-f361-4d21-b104-de38ff6b4800"
    auth_url: https://id.vngenterprise.com/authorize
    token_url: https://id.vngenterprise.com/api/oidc/token
    api_url: https://id.vngenterprise.com/api/oidc/userinfo
    role_attribute_path: "contains(groups[*], 'monitoring_admin') && 'GrafanaAdmin' || contains(groups[*], 'monitoring_editor') && 'Editor' || 'Viewer'"
    allow_assign_grafana_admin: true
    role_attribute_strict: true
    email_attribute_name: "email"
    email_attribute_path: "email"
    scopes: "openid email profile groups offline_access"
    auto_login: true
    use_pkce: true
    use_refresh_token: true
  # Email through the in-cluster smtp-relay (applications/smtp-relay), which hands
  # it to Google Workspace. smtp.vngenterprise.com resolves to the relay through
  # the CoreDNS rewrite, and its certificate is valid for that name.
  smtp:
    enabled: true
    host: smtp.vngenterprise.com:587
    user: grafana@vngenterprise.com
    from_address: grafana@vngenterprise.com
    from_name: Grafana
    ehlo_identity: grafana.vngenterprise.com
    startTLS_policy: MandatoryStartTLS
    skip_verify: false
envValueFrom:
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db-app
      key: password
  # Relay login password (OpenBao kv/smtp-relay/use1 -> grafana). Optional so a
  # missing secret only breaks email, never Grafana itself.
  GF_SMTP_PASSWORD:
    secretKeyRef:
      name: grafana-smtp
      key: password
      optional: true
envFromSecrets:
  - name: grafana-alerting
# Datasources mounted directly by the chart so they exist at Grafana startup
# (sidecar discovery races with provisioning init).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir.mimir.svc.cluster.local:8080/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "metrics"
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        editable: false
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "logs"
    deleteDatasources:
      - name: Mimir-Traces
        orgId: 1
      - name: Tempo
        orgId: 1
      - name: Pyroscope
        orgId: 1
sidecar:
  # Memory bound for the sc-dashboard / sc-alerts sidecars (use1 is
  # memory-bound). limit ~1.5x observed 7d peak (~99Mi each); cpu request only.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    provider:
      foldersFromFilesStructure: false
  datasources:
    enabled: false
  alerts:
    enabled: true
    label: grafana_alert
    labelValue: "1"
    searchNamespace: ALL
  notifiers:
    enabled: false
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 1Gi}
deploymentStrategy:
  type: Recreate
