longhornManager:
  tolerations:
    - key: "node.kubernetes.io/disk-pressure"
      operator: "Exists"
      effect: "NoSchedule"
longhornDriver:
  tolerations:
    - key: "node.kubernetes.io/disk-pressure"
      operator: "Exists"
      effect: "NoSchedule"
defaultBackupStore:
  backupTarget: s3://longhorn-use1@us-east-1/
  backupTargetCredentialSecret: longhorn-backup-storage
  pollInterval: 300
defaultSettings:
  storageOverProvisioningPercentage: "300"
  replicaAutoBalance: best-effort
  # Live-upgrade volume engines after a Longhorn upgrade, one volume per node at a time.
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  # Evict the last replica off a draining node instead of blocking the drain
  # forever (longhorn-single volumes have only one replica).
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort
  reclaimPolicy: Retain
  volumeBindingMode: Immediate
  disableRevisionCounter: "true"
  recurringJobSelector:
    enable: true
    jobList:
      - '{"name":"default","isGroup":true}'