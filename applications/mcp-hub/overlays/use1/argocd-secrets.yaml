# API token of the Argo CD local account mcp-hub (apiKey only, role:readonly; see
# argocd/patches/values.yaml) for the hub's read-only argocd section. Generated with
# `argocd --core account generate-token --account mcp-hub`; revoke it with
# `argocd account delete-token`. Stored in OpenBao at kv/mcp-hub/argocd, key
# argocd_api_token. The use1 policy (applications/openbao/config/policies/use1.hcl)
# grants ESO read on kv/data/mcp-hub/*.
#
# Rotating: the hub reads the token from its environment at startup, so a new
# value in OpenBao does not reach running pods. Write the new token, then make
# sure ESO has refreshed this Secret: either wait for the hourly refresh, or
# annotate the ExternalSecret with force-sync. Either way, confirm that
# `status.refreshTime` is later than the write and the Ready condition is True
# before you continue. Then run
# `kubectl -n mcp-hub rollout restart deployment/mcp-hub`, wait for
# `kubectl -n mcp-hub rollout status deployment/mcp-hub` to succeed, check that an
# argocd_* tool call through the hub (argocd_get_version is enough) succeeds, and
# only then delete the old token in Argo CD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-argocd
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_API_TOKEN
      remoteRef:
        key: mcp-hub/argocd
        property: argocd_api_token
