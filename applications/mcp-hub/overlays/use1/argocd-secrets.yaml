# API token of the Argo CD local account mcp-hub (apiKey only, role:readonly; see
# argocd/patches/values.yaml) for the hub's read-only argocd section. Generated with
# `argocd --core account generate-token --account mcp-hub`; revoke it with
# `argocd account delete-token`. Stored in OpenBao at kv/mcp-hub/argocd, key
# argocd_api_token. The use1 policy (applications/openbao/config/policies/use1.hcl)
# grants ESO read on kv/data/mcp-hub/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-argocd
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_API_TOKEN
      remoteRef:
        key: mcp-hub/argocd
        property: argocd_api_token
