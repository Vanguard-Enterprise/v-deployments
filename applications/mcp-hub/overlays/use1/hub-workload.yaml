# MCP hub (github.com/Vanguard-Enterprise/mcp-hub, hub/): one MCP endpoint and one
# Pocket ID login for every self-hosted MCP server. Backends are sections; the access
# policy (access-policy.json, generated into a ConfigMap) maps Pocket ID groups to
# read or write access per section, resolved per request from Pocket ID's userinfo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub
spec:
  replicas: 1
  # Zero-downtime rollouts: the new pod must pass its readiness probe (OIDC discovery
  # loaded) before the old one is removed. The policy ConfigMap name carries a content
  # hash, so editing access-policy.json rolls the pods the same way.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp-hub
  template:
    metadata:
      labels:
        app: mcp-hub
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: github-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-hub
          image: ghcr.io/vanguard-enterprise/mcp-hub:main
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Public identity of the hub (RFC 8707 resource). Must match the Pocket ID
            # API "MCP Hub" and the IngressRoute host. Its public client "MCP Hub" is
            # cfbdf773-de04-40c7-917f-316e689e00ae, restricted to the mcp_* groups.
            - name: MCP_PUBLIC_URL
              value: https://mcp.vngenterprise.com/mcp
            - name: OIDC_ISSUER
              value: https://id.vngenterprise.com
            - name: OAUTH_AUDIENCE
              value: https://mcp.vngenterprise.com/mcp
            - name: ACCESS_POLICY_FILE
              value: /etc/mcp-hub/access-policy.json
            # netbird section
            - name: NETBIRD_API_URL
              value: https://netbird.vngenterprise.com
            - name: NETBIRD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-netbird
                  key: NETBIRD_API_TOKEN
            # pocketid section. POCKETID_URL defaults to OIDC_ISSUER (this same Pocket ID).
            - name: POCKETID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-pocketid
                  key: POCKETID_API_KEY
          volumeMounts:
            - name: access-policy
              mountPath: /etc/mcp-hub
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          # Ready only once OIDC discovery against Pocket ID succeeded, so a pod that
          # cannot validate tokens never receives traffic during a rollout.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: access-policy
          configMap:
            name: mcp-hub-access-policy
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-hub
spec:
  selector:
    app: mcp-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
