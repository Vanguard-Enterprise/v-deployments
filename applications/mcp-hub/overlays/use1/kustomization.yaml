apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-hub
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - pull-secret.yaml
  - netbird-secrets.yaml
  - pocketid-secrets.yaml
  - hub-workload.yaml
  - hub-ingress.yaml
# Which Pocket ID groups get read or write access to each hub section. The generated
# name carries a content hash, so a policy change rolls the Deployment.
configMapGenerator:
  - name: mcp-hub-access-policy
    files:
      - access-policy.json
# Argo CD Image Updater pins the :main digest here (see argocd/applications/use1/mcp-hub.yaml).
images:
  - name: ghcr.io/vanguard-enterprise/mcp-hub
    newTag: main
    digest: sha256:62e50a49ea3b2ba97fd37cada5d79773ed61b5b6e896fcecebdc28fdc9e52ba8
