# NetBird Personal Access Token the MCP server uses against the Management API
# (read-only tools, but the PAT itself is a full-access user token: keep it to
# this namespace). Stored in OpenBao at kv/mcp-hub/netbird, key netbird_api_token.
# The use1 policy (applications/openbao/config/policies/use1.hcl) grants ESO read
# on kv/data/mcp-hub/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-netbird
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-netbird
    creationPolicy: Owner
  data:
    - secretKey: NETBIRD_API_TOKEN
      remoteRef:
        key: mcp-hub/netbird
        property: netbird_api_token
