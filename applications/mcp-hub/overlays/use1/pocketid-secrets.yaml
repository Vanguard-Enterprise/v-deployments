# Pocket ID admin API key for the hub's pocketid section. It acts with its owner's
# full admin rights over the identity provider (and so over every app that signs in
# through it, the hub included): keep it to this namespace. Created in Pocket ID at
# /settings/admin/api-keys; it has an expiry date, so renew it there and update
# OpenBao before it lapses. Stored in OpenBao at kv/mcp-hub/pocket-id, key
# pocketid_api_key. The use1 policy (applications/openbao/config/policies/use1.hcl)
# grants ESO read on kv/data/mcp-hub/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-pocketid
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-pocketid
    creationPolicy: Owner
  data:
    - secretKey: POCKETID_API_KEY
      remoteRef:
        key: mcp-hub/pocket-id
        property: pocketid_api_key
