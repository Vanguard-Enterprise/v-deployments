# GHCR pull credentials for the ghcr.io/vanguard-enterprise/mcp-* images.
# Same OpenBao entry every other namespace uses (dockerconfig/aliencord-github).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pull-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .mysecret | toString }}"
  data:
    - secretKey: mysecret
      remoteRef:
        key: dockerconfig/aliencord-github
