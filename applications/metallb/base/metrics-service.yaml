apiVersion: v1
kind: Service
metadata:
  name: controller-monitor-service
  namespace: metallb-system
  labels:
    app: metallb
    component: controller
spec:
  ports:
    - name: metricshttps
      port: 9120
      targetPort: 9120
  selector:
    app: metallb
    component: controller
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: speaker-monitor-service
  namespace: metallb-system
  labels:
    app: metallb
    component: speaker
spec:
  ports:
    - name: metricshttps
      port: 9120
      targetPort: 9120
  selector:
    app: metallb
    component: speaker
  clusterIP: None
