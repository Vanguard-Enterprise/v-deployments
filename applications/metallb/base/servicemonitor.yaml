apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metallb-monitor
  namespace: metallb-system
  labels:
    instance: primary
    app: metallb
spec:
  selector:
    matchLabels:
      app: metallb
  namespaceSelector:
    matchNames:
      - metallb-system
  endpoints:
    # Since v0.16.0 MetalLB serves metrics over HTTPS (self-signed) and checks the
    # scraper's bearer token via TokenReview/SubjectAccessReview (see metrics-auth-rbac.yaml).
    - port: metricshttps
      scheme: https
      authorization:
        type: Bearer
        credentials:
          name: metrics-scraper-token
          key: token
      tlsConfig:
        insecureSkipVerify: true
      interval: 30s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
          action: replace
