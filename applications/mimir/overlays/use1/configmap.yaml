apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: mimir
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: true

    activity_tracker:
      filepath: /data/metrics-activity.log

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info

    common:
      storage:
        backend: s3
        s3:
          endpoint: s3.us-east-1.wasabisys.com
          region: us-east-1
          access_key_id: ${AWS_ACCESS_KEY_ID}
          secret_access_key: ${AWS_SECRET_ACCESS_KEY}
          insecure: false
          bucket_name: ${TSDB_BUCKET_NAME}

    blocks_storage:
      backend: s3
      s3:
        bucket_name: ${TSDB_BUCKET_NAME}
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
        block_ranges_period: ["1h"]
        retention_period: 6h
        head_compaction_interval: 15m
        head_compaction_idle_timeout: 1h

    ruler_storage:
      backend: s3
      s3:
        bucket_name: ${RULER_BUCKET_NAME}

    alertmanager_storage:
      backend: s3
      s3:
        bucket_name: ${RULER_BUCKET_NAME}

    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    distributor:
      ring:
        kvstore:
          store: memberlist

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    ruler:
      enable_api: false
      rule_path: /data/ruler

    alertmanager:
      data_dir: /data/alertmanager
      sharding_ring:
        replication_factor: 1

    memberlist:
      bind_port: 7946
      join_members:
        - mimir-headless.mimir.svc.cluster.local:7946

    limits:
      compactor_blocks_retention_period: 14d
      # Raised 72h -> 168h so 7d dashboards/queries work without err-mimir-max-total-query-length.
      # Kept at 7d to match Loki retention; use1 is memory-bound so we do not go higher.
      max_total_query_length: 168h
      out_of_order_time_window: 5m
      max_global_series_per_user: 1000000
      max_global_series_per_metric: 100000
      ingestion_rate: 100000
      ingestion_burst_size: 200000

    tenant_federation:
      enabled: true

    # Per-tenant overrides live in a second key of this same ConfigMap (mounted whole at
    # /etc/mimir), reloaded live without a restart. See overrides.yaml below.
    runtime_config:
      file: /etc/mimir/overrides.yaml
      period: 15s

  # Cardinality backstop for the shared "metrics" tenant (cupboard OTLP + infra scrape).
  # These sit at the global caps (not lowered), but make them explicit per-tenant and add
  # max_label_value_length so that if a future id-labeled metric explodes, it trips the
  # per-metric series cap and that ONE metric is rejected, rather than the tenant's whole
  # series budget being consumed and starving unrelated infra metrics.
  overrides.yaml: |
    overrides:
      metrics:
        # Per-metric-name series cap: an offending metric degrades to rejection of itself.
        max_global_series_per_metric: 100000
        # Per-tenant total series cap (matches the global default; not lowered).
        max_global_series_per_user: 1000000
        # Reject pathologically long label values (an id smuggled into a value); well above
        # legitimate values like service.instance.id UUIDs, so no valid series is dropped.
        max_label_value_length: 2048
