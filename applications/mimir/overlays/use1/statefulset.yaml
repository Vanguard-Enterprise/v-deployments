apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: mimir
spec:
  serviceName: mimir-headless
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: grafana/mimir:3.1.9
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
            - name: gossip
              containerPort: 7946
          envFrom:
            - secretRef:
                name: mimir-global-env
          env:
            # Soft GC ceiling below the 3Gi hard limit so the Go runtime collects
            # under pressure instead of getting OOMKilled at the cgroup cap.
            - name: GOMEMLIMIT
              value: "2700MiB"
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            limits:   { cpu: 1,    memory: 3Gi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          # WAL replay after an unclean shutdown can take several minutes. The
          # startup probe holds off liveness until /ready first succeeds, so a
          # long replay is not killed and restarted from scratch in a loop.
          startupProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
