# One host, n8n.vngenterprise.com, split by which Traefik serves it:
#   internal Traefik  everything (editor, REST API, test webhooks). NetBird DNS
#                     points the host at it (A record 10.1.50.176), so LAN and
#                     mesh clients always land here.
#   external Traefik  public via Cloudflare, ONLY production webhooks (/webhook/).
#                     Any other path from the internet gets Traefik's 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`n8n.vngenterprise.com`)
      kind: Rule
      services:
        - name: n8n
          port: 5678
  tls:
    store:
      name: default
      namespace: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-public
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`n8n.vngenterprise.com`) && PathPrefix(`/webhook/`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
      services:
        - name: n8n
          port: 5678
  tls:
    store:
      name: default
      namespace: traefik
