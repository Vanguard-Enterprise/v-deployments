# N8N_ENCRYPTION_KEY encrypts every credential n8n stores in the database. Keep it
# with any database backup: restoring the database without it loses all credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n
    creationPolicy: Owner
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: n8n/use1
        property: encryption_key
---
# n8n's login on the smtp-relay. Only n8n's own property is read. Env vars are read
# at start, so a password change needs a refresh of this secret and a pod restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-smtp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: smtp-relay/use1
        property: n8n
