# N8N_ENCRYPTION_KEY encrypts every credential n8n stores in the database. Keep it
# with any database backup: restoring the database without it loses all credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n
    creationPolicy: Owner
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: n8n/use1
        property: encryption_key
