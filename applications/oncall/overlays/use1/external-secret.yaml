apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oncall-secrets
  namespace: oncall
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: oncall-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: monitoring/grafana-oncall
        property: SECRET_KEY
    - secretKey: MIRAGE_SECRET_KEY
      remoteRef:
        key: monitoring/grafana-oncall
        property: MIRAGE_SECRET_KEY
    - secretKey: mariadb-root-password
      remoteRef:
        key: monitoring/grafana-oncall
        property: mariadb-root-password
    - secretKey: mariadb-password
      remoteRef:
        key: monitoring/grafana-oncall
        property: mariadb-password
    - secretKey: mariadb-replication-password
      remoteRef:
        key: monitoring/grafana-oncall
        property: mariadb-replication-password
    - secretKey: rabbitmq-password
      remoteRef:
        key: monitoring/grafana-oncall
        property: rabbitmq-password
    - secretKey: rabbitmq-erlang-cookie
      remoteRef:
        key: monitoring/grafana-oncall
        property: rabbitmq-erlang-cookie
    - secretKey: redis-password
      remoteRef:
        key: monitoring/grafana-oncall
        property: redis-password
