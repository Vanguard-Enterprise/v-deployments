apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oncall.vngenterprise.com.yaml
  - external-secret.yaml
  - migrate-job.yaml
helmCharts:
  - name: oncall
    version: "1.16.5"
    repo: https://grafana.github.io/helm-charts
    releaseName: oncall
    namespace: oncall
    valuesFile: values.yaml
patches:
  - path: engine-sync-wave.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: oncall-engine
  - path: celery-sync-wave.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: oncall-celery
  - path: delete-grafana-configmap.patch.yaml
