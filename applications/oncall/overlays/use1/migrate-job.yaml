apiVersion: batch/v1
kind: Job
metadata:
  name: oncall-engine-migrate
  namespace: oncall
  labels:
    app.kubernetes.io/component: engine
    app.kubernetes.io/instance: oncall
    app.kubernetes.io/name: oncall
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 15
  ttlSecondsAfterFinished: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: engine
        app.kubernetes.io/instance: oncall
        app.kubernetes.io/name: oncall
    spec:
      restartPolicy: Never
      serviceAccountName: oncall
      containers:
        - name: oncall-migrate
          image: grafana/oncall:v1.16.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until (nc -vz "$MYSQL_HOST" "$MYSQL_PORT"); do
                echo "waiting for MySQL";
                sleep 1;
              done
              python manage.py migrate
          env:
            - name: BASE_URL
              value: https://oncall.vngenterprise.com
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: SECRET_KEY
            - name: MIRAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: MIRAGE_SECRET_KEY
            - name: MIRAGE_CIPHER_IV
              value: 1234567890abcdef
            - name: DJANGO_SETTINGS_MODULE
              value: settings.helm
            - name: AMIXR_DJANGO_ADMIN_PATH
              value: admin
            - name: OSS
              value: "True"
            - name: DETACHED_INTEGRATIONS_SERVER
              value: "False"
            - name: UWSGI_LISTEN
              value: "1024"
            - name: BROKER_TYPE
              value: rabbitmq
            - name: GRAFANA_API_URL
              value: http://grafana.grafana.svc.cluster.local
            - name: FEATURE_EMAIL_INTEGRATION_ENABLED
              value: "False"
            - name: FEATURE_PROMETHEUS_EXPORTER_ENABLED
              value: "False"
            - name: MYSQL_HOST
              value: oncall-mariadb
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DB_NAME
              value: oncall
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: mariadb-root-password
            - name: REDIS_PROTOCOL
              value: redis
            - name: REDIS_HOST
              value: oncall-redis-master
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DATABASE
              value: "0"
            - name: REDIS_USERNAME
              value: ""
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: redis-password
            - name: RABBITMQ_USERNAME
              value: user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oncall-secrets
                  key: rabbitmq-password
            - name: RABBITMQ_HOST
              value: oncall-rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_PROTOCOL
              value: amqp
            - name: RABBITMQ_VHOST
              value: ""
