base_url: oncall.vngenterprise.com
base_url_protocol: https

image:
  pullPolicy: IfNotPresent

# The existing cluster already provides Traefik, cert-manager, and Grafana.
# Keep the OnCall dependencies inside this release for the first self-hosted trial.
ingress:
  enabled: false
ingress-nginx:
  enabled: false
cert-manager:
  enabled: false
grafana:
  enabled: false
externalGrafana:
  url: http://grafana.grafana.svc.cluster.local

service:
  enabled: false

# Migrations run from migrate-job.yaml after the bundled databases are ready.
migrate:
  enabled: false

database:
  type: mysql
mariadb:
  enabled: true
  image:
    repository: bitnamilegacy/mariadb
  auth:
    database: oncall
    existingSecret: oncall-secrets
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

rabbitmq:
  enabled: true
  image:
    repository: bitnamilegacy/rabbitmq
  auth:
    existingPasswordSecret: oncall-secrets
    existingErlangSecret: oncall-secrets
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
  auth:
    existingSecret: oncall-secrets
    existingSecretPasswordKey: redis-password
  master:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  replica:
    replicaCount: 0

engine:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

celery:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

oncall:
  secrets:
    existingSecret: oncall-secrets
    secretKey: SECRET_KEY
    mirageSecretKey: MIRAGE_SECRET_KEY
  smtp:
    enabled: false
  slack:
    enabled: false
  telegram:
    enabled: false

prometheus:
  enabled: false
