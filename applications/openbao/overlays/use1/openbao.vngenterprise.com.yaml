apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
  namespace: openbao
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openbao.vngenterprise.com`)
      kind: Rule
      services:
        - name: openbao-active
          port: 8200
  tls:
    store:
      name: default
      namespace: traefik
