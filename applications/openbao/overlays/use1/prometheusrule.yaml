# ⚠️ METRIC NAMES NOT YET VERIFIED.
# These exprs use Vault's metric names (vault_*). OpenBao 2.x may emit `bao_*`
# instead. Before relying on these alerts, capture the real names once OpenBao is
# running and unsealed:
#   kubectl -n openbao exec openbao-0 -- \
#     wget -qO- 'http://127.0.0.1:8200/v1/sys/metrics?format=prometheus' | grep -E 'unsealed|handle_request'
# Then replace vault_* with the actual prefix below. A wrong metric name = a
# silent alert that never fires, so do NOT skip this check.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-alerts
  namespace: alloy-metrics
  labels:
    alloy_rules: pods
spec:
  groups:
    - name: openbao.rules
      rules:
        - alert: OpenBaoSealed
          annotations:
            description: OpenBao instance {{ $labels.instance }} is sealed.
            summary: OpenBao is sealed
          expr: vault_core_unsealed == 0
          for: 0m
          labels:
            severity: critical

        - alert: OpenBaoHighErrorRate
          annotations:
            description: High error rate on OpenBao instance {{ $labels.instance }}
            summary: OpenBao has a high error rate
          expr: rate(vault_core_handle_request_count{success="false"}[5m]) / rate(vault_core_handle_request_count[5m]) > 0.1
          for: 5m
          labels:
            severity: warning

        - alert: OpenBaoNotReady
          annotations:
            description: OpenBao instance {{ $labels.instance }} is not ready (initialized=0 or unsealed=0 or standby=1)
            summary: OpenBao instance is not ready to serve requests
          expr: up{job="openbao"} == 0
          for: 5m
          labels:
            severity: critical
