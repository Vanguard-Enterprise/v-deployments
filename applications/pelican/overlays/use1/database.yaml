apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pelican-db
  namespace: pelican
spec:
  # Deliberately non-HA for now. Backups will be added separately before this
  # database is treated as durable production storage.
  instances: 1
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: pelican
      owner: pelican
  storage:
    size: 5Gi
    storageClass: longhorn
