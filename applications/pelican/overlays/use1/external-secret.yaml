apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pelican-database
  namespace: pelican
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pelican-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "pelican"
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: pelican/production
        property: MYSQL_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pelican-app
  namespace: pelican
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pelican-app
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: pelican/production
        property: APP_KEY
