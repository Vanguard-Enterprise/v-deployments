apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican
  namespace: pelican
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gpanel.vngenterprise.com`)
      kind: Rule
      services:
        - name: panel
          port: 80
          scheme: http
  tls:
    store:
      name: default
      namespace: traefik
