# Wasabi credentials for pocket-id-db backups: user svc-pocket-id, limited to
# the cnpg-pocket-id-use1 bucket (us-east-2). Stored in OpenBao kv/pocket-id/backup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-db-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pocket-id-db-backup
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: pocket-id/backup
        property: AWS_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: pocket-id/backup
        property: AWS_ACCESS_SECRET_ID
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pocket-id-db-twice-daily
spec:
  schedule: "0 0 3,15 * * *"
  backupOwnerReference: self
  cluster:
    name: pocket-id-db
  method: barmanObjectStore
