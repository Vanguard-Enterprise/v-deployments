# Pocket ID's database. Same shape as grafana-db (cnpg-grafana): WAL archiving
# plus twice-daily base backups to the Wasabi bucket cnpg-pocket-id-use1.
# A restore also needs ENCRYPTION_KEY (OpenBao kv/pocket-id/use1).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  # Single instance: the operator PDB (minAvailable 1 on the primary) can never be
  # satisfied, so it blocks every node drain forever. Drains restart the DB once.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  bootstrap:
    initdb:
      database: pocketid
      owner: pocketid
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-pocket-id-use1
      endpointURL: https://s3.us-east-2.wasabisys.com
      s3Credentials:
        accessKeyId:
          name: pocket-id-db-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: pocket-id-db-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  storage:
    size: 2Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
