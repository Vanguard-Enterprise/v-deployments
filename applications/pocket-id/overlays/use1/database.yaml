# Pocket ID's database. Same shape as grafana-db (cnpg-grafana), minus backups:
# there is no off-cluster backup yet. Add a barmanObjectStore + ScheduledBackup
# before moving real logins off Zitadel.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  # Single instance: the operator PDB (minAvailable 1 on the primary) can never be
  # satisfied, so it blocks every node drain forever. Drains restart the DB once.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  bootstrap:
    initdb:
      database: pocketid
      owner: pocketid
  storage:
    size: 2Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
