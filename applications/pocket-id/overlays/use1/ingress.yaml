apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`id.vngenterprise.com`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
      services:
        - name: pocket-id
          port: 1411
  tls:
    store:
      name: default
      namespace: traefik
