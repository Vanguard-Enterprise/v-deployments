# ENCRYPTION_KEY encrypts secrets Pocket ID stores in the database. Keep it with
# any database backup: restoring the database without this key loses them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pocket-id
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: pocket-id/use1
        property: encryption_key
