apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cupboard-redis-secrets
  namespace: cupboard-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cupboard-redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: cupboard/staging/redis
        property: password
