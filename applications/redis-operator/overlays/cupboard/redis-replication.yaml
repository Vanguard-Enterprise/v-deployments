# Standalone Redis (streams bus) for cupboard staging. clusterSize 1 = a single master;
# the operator still exposes cupboard-redis-master. Small footprint on the memory-bound
# staging cluster; scale up / add sentinel for prod.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: cupboard-redis
  namespace: cupboard-redis
spec:
  clusterSize: 1
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.7
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: cupboard-redis-secrets
      key: password
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
