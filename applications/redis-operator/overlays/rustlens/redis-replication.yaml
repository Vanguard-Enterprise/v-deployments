apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: rustlens-redis
  namespace: rustlens-redis
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.7
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: rustlens-redis-secrets
      key: password
    # Memory bound (use1 is memory-bound). Real usage ~5Mi; generous limit is a
    # node-OOM backstop, effectively never hit. cpu request only.
    # NOTE follow-up: set redis maxmemory (+policy) via additionalRedisConfig so
    # data growth is bounded gracefully rather than OOMKilled at the cgroup cap.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - rustlens-redis
            topologyKey: kubernetes.io/hostname
