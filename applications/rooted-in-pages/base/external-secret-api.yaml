apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rooted-in-pages-api-secrets
  namespace: rooted-in-pages
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rooted-in-pages-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: SHOPIFY_STOREFRONT_TOKEN
      remoteRef:
        key: rooted-in-pages/test
        property: shopify_storefront_token
    - secretKey: SHOPIFY_CUSTOMER_CLIENT_ID
      remoteRef:
        key: rooted-in-pages/test
        property: shopify_customer_client_id
    - secretKey: SHOPIFY_CUSTOMER_CLIENT_SECRET
      remoteRef:
        key: rooted-in-pages/test
        property: shopify_customer_client_secret
    - secretKey: SESSION_KEY
      remoteRef:
        key: rooted-in-pages/test
        property: session_key
