apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rooted-in-pages
  namespace: rooted-in-pages
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rooted-in-pages.vngenterprise.com`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))
      kind: Rule
      priority: 100
      services:
        - name: rooted-in-pages-api
          port: 8080
    - match: Host(`rooted-in-pages.vngenterprise.com`)
      kind: Rule
      priority: 1
      services:
        - name: rooted-in-pages-web
          port: 3000
  tls:
    store:
      name: default
      namespace: traefik
