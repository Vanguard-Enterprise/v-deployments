apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeguard
  labels:
    app.kubernetes.io/name: routeguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routeguard
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      containers:
        - name: dashboard
          image: ghcr.io/vanguard-enterprise/routeguard-dashboard:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
