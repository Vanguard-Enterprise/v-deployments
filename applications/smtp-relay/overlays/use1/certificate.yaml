# Inbound STARTTLS certificate. Clients verify smtp-relay.vngenterprise.com, which
# resolves to this relay inside the cluster (CoreDNS rewrite) and on NetBird.
# First issuance can take up to ~30 minutes: cert-manager looks the challenge
# name up before creating the record, and Cloudflare's nameservers then serve the
# cached "no record" answer for up to the zone's negative TTL (SOA minimum, 1800s).
# Deleting the Challenge restarts that wait, so leave it alone.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-relay-tls
spec:
  secretName: smtp-relay-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - smtp-relay.vngenterprise.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
