# Inbound STARTTLS certificate. Clients verify smtp-relay.vngenterprise.com, which
# resolves to this relay inside the cluster (CoreDNS rewrite) and on NetBird.
# Not smtp.vngenterprise.com: Cloudflare never serves a TXT record at
# _acme-challenge.smtp.vngenterprise.com (even a hand-made one), so DNS-01 for
# that name can never complete.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-relay-tls
spec:
  secretName: smtp-relay-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - smtp-relay.vngenterprise.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
