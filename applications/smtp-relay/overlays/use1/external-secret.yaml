# One relay login per app. Passwords live in OpenBao kv/smtp-relay/use1, one
# property per app (random, no ':' or ','). Each app's own ExternalSecret reads
# only its property, so an app never sees another app's password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay-users
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: smtp-relay-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The image turns this into its SASL database at startup. A new or changed
        # login takes effect after a pod restart (kubectl rollout restart).
        SMTPD_SASL_USERS: "grafana@vngenterprise.com:{{ .grafana }},identity@vngenterprise.com:{{ .pocket_id }},n8n@vngenterprise.com:{{ .n8n }}"
  data:
    - secretKey: grafana
      remoteRef:
        key: smtp-relay/use1
        property: grafana
    - secretKey: pocket_id
      remoteRef:
        key: smtp-relay/use1
        property: pocket_id
    - secretKey: n8n
      remoteRef:
        key: smtp-relay/use1
        property: n8n
