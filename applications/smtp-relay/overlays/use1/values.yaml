# Outbound-only Postfix relay: apps log in here, Postfix forwards to the Google
# Workspace SMTP relay. See https://github.com/Vanguard-Enterprise/v-deployments/wiki/SMTP-Relay for the design and how to add an app.
fullnameOverride: smtp-relay
# The chart's default stamps `now` into the pod template, which makes every Argo CD
# render a new rollout. Config checksums still roll the pods when values change.
recreateOnRedeploy: false

replicaCount: 2

image:
  repository: ghcr.io/bokysan/postfix
  tag: "5.2.1"

serviceAccount:
  create: true

# LoadBalancer so LAN and NetBird clients (Proxmox, Docker hosts) reach the same
# relay as the pods. smtp-relay.vngenterprise.com points at this address (NetBird DNS
# zone for clients, CoreDNS rewrite inside the cluster).
service:
  type: LoadBalancer
  port: 587
  # Local keeps the client's real address. With Cluster, kube-proxy SNATs LAN
  # clients to a node pod-CIDR address that Cilium classifies as "world", so the
  # network policy dropped them. MetalLB announces only from nodes running a
  # relay pod, and the relay logs show the real client.
  externalTrafficPolicy: Local
  annotations:
    metallb.io/loadBalancerIPs: 10.1.50.177

# One queue per replica on its own volume, so queued mail survives a restart.
persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn

# Inbound TLS (STARTTLS on 587) from the cert-manager certificate in certificate.yaml.
# The chart mounts it at /var/run/certs and points smtpd_tls_* at it.
certs:
  create: false
  existingSecret: smtp-relay-tls

# SMTPD_SASL_USERS (one login per app) from OpenBao, see external-secret.yaml.
existingSecret: smtp-relay-users

config:
  general:
    # Google Workspace SMTP relay. It authorizes us by our public IP (registered in
    # Admin console > Gmail > Routing > SMTP relay service), so no Google login here.
    RELAYHOST: "[smtp-relay.gmail.com]:587"
    ALLOWED_SENDER_DOMAINS: vngenterprise.com
    LOG_FORMAT: json
  postfix:
    myhostname: smtp-relay.vngenterprise.com
    # Nothing is trusted by address: every client must log in, including localhost.
    mynetworks: 127.0.0.0/8

    # ---- inbound (apps -> relay) ----
    smtpd_tls_security_level: encrypt
    smtpd_tls_auth_only: "yes"
    smtpd_tls_protocols: ">=TLSv1.2"
    smtpd_tls_mandatory_protocols: ">=TLSv1.2"
    smtpd_sasl_security_options: noanonymous
    smtpd_sasl_tls_security_options: noanonymous
    # Each login may only use the envelope sender addresses listed for it.
    smtpd_sender_login_maps: texthash:/etc/postfix/custom/sender_login_maps
    smtpd_client_restrictions: permit_sasl_authenticated, reject
    smtpd_helo_restrictions: reject_invalid_helo_hostname, permit
    smtpd_sender_restrictions: reject_non_fqdn_sender, reject_sender_login_mismatch, permit_sasl_authenticated, reject
    smtpd_relay_restrictions: permit_sasl_authenticated, reject
    smtpd_recipient_restrictions: reject_non_fqdn_recipient, reject_unknown_recipient_domain, permit_sasl_authenticated, reject
    # Stop a runaway app from burning the Google relay's daily quota.
    smtpd_client_message_rate_limit: "120"
    message_size_limit: "26214400"

    # ---- outbound (relay -> Google) ----
    smtp_tls_security_level: secure
    smtp_tls_mandatory_protocols: ">=TLSv1.2"
    # Google rejects with 550 5.7.x when our public IP is not the registered one.
    # Rewrite that to 450 so mail waits in the queue until the IP is updated.
    smtp_reply_filter: pcre:/etc/postfix/custom/smtp_reply_filter.pcre

    # ---- queue ----
    # Keep undeliverable mail 5 days, retrying at least every 15 minutes, so mail
    # goes out soon after the Google side is fixed.
    maximal_queue_lifetime: 5d
    bounce_queue_lifetime: 5d
    minimal_backoff_time: 5m
    maximal_backoff_time: 15m
    queue_run_delay: 5m

extraVolumes:
  - name: policy
    configMap:
      name: smtp-relay-policy
extraVolumeMounts:
  - name: policy
    mountPath: /etc/postfix/custom
    readOnly: true

# Postfix's master runs as root and drops to the postfix user, so the namespace
# runs at the baseline Pod Security level. Only baseline-allowed capabilities.
pod:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
container:
  postfix:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
        add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

terminationGracePeriodSeconds: 60

# The chart's startup probe also waits for an opendkim process. DKIM signing is
# left to Google, so only wait for supervisord and the Postfix master.
startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 24
  exec:
    command:
      - sh
      - -c
      - ps axf | fgrep -v grep | egrep -q '\{supervisord\}|/usr/bin/supervisord' && ps axf | fgrep -v grep | egrep -q '(/usr/lib/postfix/sbin/|/usr/libexec/postfix/)master'
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 8
  failureThreshold: 3
  exec:
    command: [sh, -c, /scripts/healthcheck.sh]

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mail
              app.kubernetes.io/instance: smtp-relay

metrics:
  enabled: true
  image:
    repository: boky/postfix-exporter
    tag: "5.2.1"
  serviceMonitor:
    enabled: true
    labels:
      # alloy-metrics selects ServiceMonitors on this label.
      instance: primary
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi
