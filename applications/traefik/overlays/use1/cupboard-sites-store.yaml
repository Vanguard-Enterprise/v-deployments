# Serves *.sites.vngenterprise.com (tenant default storefronts) — referenced by the
# cupboard-web public sites IngressRoute via tls.store.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: cupboard-sites
  namespace: traefik
spec:
  defaultCertificate:
    secretName: cupboard-sites-tls
