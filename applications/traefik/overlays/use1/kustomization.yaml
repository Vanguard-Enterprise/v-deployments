apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - default-store.yaml
  - mancini-store.yaml
  - pelican-wings.yaml
helmCharts:
  - name: traefik
    version: "42.3.0"
    repo: https://helm.traefik.io/traefik
    releaseName: traefik
    valuesFile: values.yaml
    namespace: traefik
