apiVersion: v1
kind: Service
metadata:
  name: pelican-wings
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pelican-wings
  namespace: traefik
subsets:
  - addresses:
      - ip: 10.1.70.10
    ports:
      - name: http
        port: 8080
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pelican-wings-cloudflare-only
  namespace: traefik
spec:
  # Match the TCP peer address, not X-Forwarded-For, so a direct request cannot
  # forge a Cloudflare client header and bypass the origin restriction.
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-wings
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`wings-use1.vngenterprise.com`)
      middlewares:
        - name: pelican-wings-cloudflare-only
      services:
        - name: pelican-wings
          port: 8080
          scheme: http
  tls:
    store:
      name: default
      namespace: traefik
