apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: the server lives in vanguard-nexus and the agent in vn-agent,
# so every resource names its own namespace.
resources:
  - namespace.yaml
  - database.yaml
  - secrets.yaml
  - server.yaml
  - ingress.yaml
  - agent.yaml
images:
  - name: ghcr.io/vanguard-enterprise/vn-server
    newTag: sha-672d4fc4167dd55f429776c0a6ccd23fa580c84e
  - name: ghcr.io/vanguard-enterprise/vn-agent
    newTag: sha-672d4fc4167dd55f429776c0a6ccd23fa580c84e
