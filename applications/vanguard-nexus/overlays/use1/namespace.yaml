apiVersion: v1
kind: Namespace
metadata:
  name: vanguard-nexus
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false
---
# The agent's namespace. It enforces the restricted Pod Security Standard, like the
# upstream install manifest (deploy/kubernetes/vn-agent.yaml in v-nexus).
apiVersion: v1
kind: Namespace
metadata:
  name: vn-agent
  labels:
    app.kubernetes.io/name: vn-agent
    app.kubernetes.io/part-of: vanguard-nexus
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Keeps the agent identity Secret (created by the agent, not by Argo) if the app
    # is ever pruned.
    argocd.argoproj.io/sync-options: Prune=false
