# Agent challenge key: base64 of 48 random bytes, generated once in the cluster.
# It only signs short-lived (one minute) agent challenges, so it needs no backup:
# if the Secret is lost, a new key only invalidates challenges still outstanding.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vn-agent-challenge-key
  namespace: vanguard-nexus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vn-agent-challenge-key
  namespace: vanguard-nexus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Generate once and never rotate: every server replica must share the key.
  refreshInterval: "0"
  target:
    name: vn-agent-challenge-key
    creationPolicy: Owner
    template:
      data:
        key: "{{ .password | b64enc }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vn-agent-challenge-key
---
# GHCR pull credentials. Same OpenBao entry every other namespace uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pull-secret
  namespace: vanguard-nexus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .mysecret | toString }}"
  data:
    - secretKey: mysecret
      remoteRef:
        key: dockerconfig/aliencord-github
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pull-secret
  namespace: vn-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .mysecret | toString }}"
  data:
    - secretKey: mysecret
      remoteRef:
        key: dockerconfig/aliencord-github
