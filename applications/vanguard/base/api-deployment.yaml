apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-api
  namespace: vanguard-portal
  labels:
    app.kubernetes.io/name: vanguard-api
    app.kubernetes.io/part-of: vanguard-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vanguard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vanguard-api
        app.kubernetes.io/part-of: vanguard-portal
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/vanguard-enterprise/vanguard-api:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vanguard-api-config
            - secretRef:
                name: vanguard-api-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

