apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-frontend
  namespace: vanguard-portal
  labels:
    app.kubernetes.io/name: vanguard-frontend
    app.kubernetes.io/part-of: vanguard-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vanguard-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vanguard-frontend
        app.kubernetes.io/part-of: vanguard-portal
    spec:
      imagePullSecrets:
        - name: github-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/vanguard-enterprise/vanguard-frontend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi

