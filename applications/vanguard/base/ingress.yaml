apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vanguard-api-strip-prefix
  namespace: vanguard-portal
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vanguard-portal
  namespace: vanguard-portal
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vngenterprise.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: vanguard-api-strip-prefix
      services:
        - name: vanguard-api
          port: 8080
    - match: Host(`vngenterprise.com`) && PathPrefix(`/ws`)
      kind: Rule
      priority: 90
      services:
        - name: vanguard-api
          port: 8080
    - match: Host(`vngenterprise.com`)
      kind: Rule
      priority: 1
      services:
        - name: vanguard-frontend
          port: 3000
  tls:
    store:
      name: default
      namespace: traefik

