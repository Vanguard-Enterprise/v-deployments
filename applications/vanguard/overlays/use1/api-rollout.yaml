apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-api
  namespace: vanguard-portal
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
      - name: api
        resources:
          requests:
            cpu: 75m
