fullnameOverride: postgres
global:
  storageClass: longhorn
volumePermissions:
  enabled: true
tls:
  enabled: true
  certificatesSecret: postgres-cert
  certFilename: "tls.crt"
  certKeyFilename: "tls.key"
auth:
  existingSecret: "zitadel-secret"
primary:
  persistence:
    size: 5Gi
  # Memory bound (use1 is memory-bound). This DB was node-OOMKilled while
  # unbounded during the phase-1 roll. Real (anon) usage is tiny (~tens of Mi);
  # limit gives ample headroom + node-OOM protection. cpu request only.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  # PostgreSQL major upgrades require a planned dump/restore migration. Keep
  # the chart update on the exact verified PostgreSQL 17.5 image for now.
  digest: sha256:42a8200d35971f931b869ef5252d996e137c6beb4b8f1b6d2181dc7d1b6f62e0
