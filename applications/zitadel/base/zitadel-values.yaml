replicaCount: 3
serviceAccount:
  create: true
  annotations: {}
configMap:
  annotations: {}
zitadel:
  masterkeySecretName: zitadel-secret
  configSecretName: zitadel-secret-config
  configmapConfig:
    ExternalSecure: true
    ExternalDomain: accounts.vngenterprise.com
    TLS:
      Enabled: false
    Database:
      Postgres:
        Host: postgres
        Port: 5432
        Database: zitadel
        MaxOpenConns: 20
        MaxIdleConns: 10
        MaxConnLifetime: 30m
        MaxConnIdleTime: 5m
        User:
          Username: zitadel
          SSL:
            Mode: verify-full
        Admin:
          Username: postgres
          SSL:
            Mode: verify-full
  dbSslCaCrtSecret: postgres-cert
  dbSslAdminCrtSecret: postgres-cert
  dbSslUserCrtSecret: zitadel-cert
ingress:
  enabled: false
login:
  enabled: false

# Memory bound (use1 is memory-bound). limit ~1.5x observed 7d peak (~186Mi);
# cpu request only. GOMEMLIMIT (~90% of limit) makes the Go runtime GC before
# hitting the hard cap, avoiding OOMKill near the limit.
env:
  - name: GOMEMLIMIT
    value: "345MiB"
resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    memory: 384Mi