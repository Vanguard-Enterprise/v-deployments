apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cupboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    path: applications/cloudnative-postgres/overlays/cupboard
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: cupboard-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
