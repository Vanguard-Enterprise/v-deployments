# Must be applied manually the first time: app-of-apps does not adopt new
# Application CRs (phase5-closeout runbook is authoritative).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cupboard-bot
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: bot=ghcr.io/vanguard-enterprise/cupboard-bot:main
    argocd-image-updater.argoproj.io/bot.update-strategy: digest
    argocd-image-updater.argoproj.io/bot.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    path: applications/cupboard/overlays/bot
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: cupboard-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
