apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cupboard-marketing
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: marketing=ghcr.io/vanguard-enterprise/cupboard-marketing:main
    argocd-image-updater.argoproj.io/marketing.update-strategy: digest
    argocd-image-updater.argoproj.io/marketing.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source: {repoURL: https://github.com/Vanguard-Enterprise/v-deployments, path: applications/cupboard/overlays/marketing, targetRevision: main}
  destination: {server: https://kubernetes.default.svc, namespace: cupboard-marketing}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
