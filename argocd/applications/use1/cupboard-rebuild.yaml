apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cupboard-rebuild
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: api=ghcr.io/vanguard-enterprise/cupboard-api,web=ghcr.io/vanguard-enterprise/cupboard-web
    argocd-image-updater.argoproj.io/api.update-strategy: newest-build
    argocd-image-updater.argoproj.io/web.update-strategy: newest-build
    argocd-image-updater.argoproj.io/api.allow-tags: regexp:^sha-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/web.allow-tags: regexp:^sha-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/api.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/web.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    path: applications/cupboard-rebuild/overlays/use1
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: cupboard-rebuild
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
