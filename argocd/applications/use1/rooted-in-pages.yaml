---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rooted-in-pages
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: api=ghcr.io/vanguard-enterprise/rooted-in-pages-api:main,web=ghcr.io/vanguard-enterprise/rooted-in-pages-web:main
    argocd-image-updater.argoproj.io/api.update-strategy: digest
    argocd-image-updater.argoproj.io/web.update-strategy: digest
    argocd-image-updater.argoproj.io/api.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/web.pull-secret: pullsecret:argocd/ghcr-image-updater
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    path: applications/rooted-in-pages/overlays/use1
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: rooted-in-pages
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
