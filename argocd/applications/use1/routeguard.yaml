apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routeguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vanguard-Enterprise/v-deployments
    path: applications/routeguard/base
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: routeguard
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      name: github-pull-secret
      namespace: routeguard
      jsonPointers:
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
        - /spec/target/deletionPolicy
        - /spec/target/template/engineVersion
        - /spec/target/template/mergePolicy
        - /spec/target/template/metadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
