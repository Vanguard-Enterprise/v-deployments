redis:
  enabled: false

redis-ha:
  enabled: true
  # Memory bounds: haproxy 7d peak ~82Mi, redis ~30Mi, sentinel ~7Mi.
  haproxy:
    # Soft anti-affinity: with 3 replicas hard-pinned across exactly 3 schedulable
    # workers and maxUnavailable=0/maxSurge=1, any rolling update deadlocks (the
    # surge pod can't place on an occupied node). Soft lets it co-locate briefly
    # during rolls while still preferring spread. (redis is a StatefulSet — rolls
    # one ordinal at a time, no surge — so its hardAntiAffinity stays true.)
    hardAntiAffinity: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 192Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Workaround for the sentinel container pinning 100% CPU after a restart
  # (argoproj/argo-cd#16360, fix PR #20645). A single member restart can wedge
  # the two long-running peers, so reset the monitored group on every stable
  # Sentinel endpoint, not only the container that just started. Remote resets
  # are best-effort so an unavailable peer cannot put this container in a
  # postStart restart loop. The master group name is "argocd".
  sentinel:
    lifecycle:
      postStart:
        exec:
          command:
            - /bin/sh
            - -c
            - |
              set -e
              sleep 30
              redis-cli -p 26379 sentinel reset argocd
              for sentinel_endpoint in \
                argocd-redis-ha-announce-0 \
                argocd-redis-ha-announce-1 \
                argocd-redis-ha-announce-2; do
                reset_attempt=1
                until redis-cli -h "$sentinel_endpoint" -p 26379 sentinel reset argocd; do
                  if [ "$reset_attempt" -ge 3 ]; then
                    echo "Unable to reset $sentinel_endpoint after $reset_attempt attempts" >&2
                    break
                  fi
                  reset_attempt=$((reset_attempt + 1))
                  sleep 2
                done
              done
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi

controller:
  replicas: 1
  # Largest unbounded stateless workload on use1: ~553Mi live Go heap, 966Mi 7d
  # peak. limit ~1.5x peak; GOMEMLIMIT (~90% of limit) GCs before the hard cap.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1536Mi
  env:
    - name: GOMEMLIMIT
      value: "1375MiB"

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
  # 7d peak ~160Mi. cpu request only.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
  # 7d peak ~455Mi (manifest rendering / kustomize+helm). cpu request only.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

applicationSet:
  replicas: 2
  # 7d peak ~149Mi.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

dex:
  # 7d peak ~126Mi.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  # 7d peak ~38Mi.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

global:
  domain: argocd.vngenterprise.com

configs:
  cm:
    url: https://argocd.vngenterprise.com
    admin.enabled: false
    kustomize.buildOptions: --enable-helm
    statusbadge.enabled: "true"
    oidc.config: |
      name: Pocket ID
      issuer: https://id.vngenterprise.com
      clientID: "fbecc916-dd03-4512-a664-87c3d53d4cb1"
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      logoutURL: https://id.vngenterprise.com/api/oidc/end-session
      enablePKCEAuthentication: true

  rbac:
    create: true
    policy.csv: |
      g, argocd_administrators, role:admin
      g, argocd_users, role:readonly
    policy.default: ""
    scopes: "[groups]"
