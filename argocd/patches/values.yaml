redis:
  enabled: false

redis-ha:
  enabled: true
  # Memory bounds: haproxy 7d peak ~82Mi, redis ~30Mi, sentinel ~7Mi.
  haproxy:
    # Soft anti-affinity: with 3 replicas hard-pinned across exactly 3 schedulable
    # workers and maxUnavailable=0/maxSurge=1, any rolling update deadlocks (the
    # surge pod can't place on an occupied node). Soft lets it co-locate briefly
    # during rolls while still preferring spread. (redis is a StatefulSet — rolls
    # one ordinal at a time, no surge — so its hardAntiAffinity stays true.)
    hardAntiAffinity: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 192Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Workaround for the sentinel container pinning 100% CPU after a rolling
  # restart (argoproj/argo-cd#16360, fix PR #20645). The sentinel event loop
  # wedges on stale sentinel/replica state; a `sentinel reset` shortly after
  # startup clears it. master group name is "argocd".
  sentinel:
    lifecycle:
      postStart:
        exec:
          command:
            - /bin/sh
            - -c
            - sleep 30; redis-cli -p 26379 sentinel reset argocd
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi

controller:
  replicas: 1
  # Largest unbounded stateless workload on use1: ~553Mi live Go heap, 966Mi 7d
  # peak. limit ~1.5x peak; GOMEMLIMIT (~90% of limit) GCs before the hard cap.
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
  env:
    - name: GOMEMLIMIT
      value: "1375MiB"

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
  # 7d peak ~160Mi. cpu request only.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
  # 7d peak ~455Mi (manifest rendering / kustomize+helm). cpu request only.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

applicationSet:
  replicas: 2
  # 7d peak ~149Mi.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

dex:
  # 7d peak ~126Mi.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  # 7d peak ~38Mi.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

global:
  domain: argocd.vngenterprise.com

configs:
  cm:
    url: https://argocd.vngenterprise.com
    admin.enabled: false
    kustomize.buildOptions: --enable-helm
    statusbadge.enabled: "true"
    oidc.config: |
      name: Zitadel
      issuer: https://accounts.vngenterprise.com
      clientID: "356128038108333174"
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      logoutURL: https://accounts.vngenterprise.com/oidc/v1/end_session
      enablePKCEAuthentication: true

  rbac:
    create: true
    policy.csv: |
      g, argocd_administrators, role:admin
      g, argocd_users, role:readonly
    policy.default: ""
    scopes: "[groups]"