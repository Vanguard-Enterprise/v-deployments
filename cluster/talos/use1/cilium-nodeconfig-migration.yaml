# Per-node migration gate (Phase 7 PR5, Window B step 2).
#
# Inert until a node is labelled: only nodes carrying
# io.cilium.migration/cilium-default=true get the Cilium CNI conf written, which is what
# makes the flannel -> Cilium switch happen ONE NODE AT A TIME. Applying this object
# changes nothing on its own.
#
# Flip a node with:
#   kubectl label node <node> --overwrite io.cilium.migration/cilium-default=true
# Un-flip (rollback, before finalize):
#   kubectl label node <node> io.cilium.migration/cilium-default-
#
# Removed at finalize, when cni.customConf goes false cluster-wide.
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  namespace: kube-system
  name: cilium-default
spec:
  nodeSelector:
    matchLabels:
      io.cilium.migration/cilium-default: "true"
  defaults:
    write-cni-conf-when-ready: /host/etc/cni/net.d/05-cilium.conflist
    custom-cni-conf: "false"
    cni-chaining-mode: "none"
    cni-exclusive: "true"
