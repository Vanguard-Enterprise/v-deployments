# Cilium FINAL (post-migration) values for use1 (Phase 7 PR5, Window B step 5).
#
# Applied after all 6 nodes are on Cilium and flannel is removed. Differences from
# cilium-values-migration.yaml: Cilium now owns the CNI conf everywhere
# (cni.customConf false), the operator may restart unmanaged pods, policy enforcement
# returns to default (still no policies until PR6), and the flannel-coexistence
# workaround (bpf.hostLegacyRouting) is off.
#
# Kept from migration: the cluster-pool CIDR (10.245.0.0/16 is now THE pod network),
# tunnel port 8472, KubePrism endpoint, kube-proxy retained, and the Talos-mandatory
# capability/cgroup settings.

operator:
  unmanagedPodWatcher:
    restart: true

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8472

# PR7 prerequisite (Linkerd): linkerd-cni appends itself to the EXISTING conflist
# (05-cilium.conflist) rather than dropping its own file. With cni.exclusive true,
# cilium-agent fsnotify-watches /etc/cni/net.d and regenerates its conflist on any
# change, which turns that into a write-fight loop and can leave a pod scheduled in
# the losing window with no proxy redirect. Cilium's own source names disabling the
# watcher as the accommodation for chained plugins.
# Safe to turn off HERE specifically because exclusive was doing migration work
# (evicting flannel's conflist); flannel is deleted and nothing else competes now.
cni:
  customConf: false
  uninstall: false
  exclusive: false

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16

# Default enforcement: no policy = allow all, until PR6 stages default-deny via
# Cilium policy audit mode per namespace.
policyEnforcementMode: default

bpf:
  hostLegacyRouting: false

k8sServiceHost: localhost
k8sServicePort: 7445

kubeProxyReplacement: false

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
